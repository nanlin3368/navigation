<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>倒计时跳转中…</title>
    <link rel="apple-touch-icon" href="assets/picture/nav.svg" />
    <link rel="icon" href="assets/picture/nav.svg" type="image/svg" />
    <script src="src/scripts/security.js" defer></script>
    <style>
      /* --- 全局重置 --- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      /* --- CSS 变量 --- */
      :root {
        --color: #007ee6;
        --grad-color: #007ee6;
        --bg: #eeedf2;
        --panel: #ffffff;
        --border: #d0d2dc;
        --text: #1c1c1e;
        --text-sub: #8e8e93;
        --tip-bg: #1c1c1e;
        --tip-text: #ffffff;
        --shadow-sm:
          0 1px 2px rgba(0, 0, 0, 0.04), 0 2px 6px rgba(0, 0, 0, 0.03);
        --shadow-md:
          0 4px 12px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.04);
        --shadow-lg:
          0 10px 28px rgba(0, 0, 0, 0.08), 0 3px 8px rgba(0, 0, 0, 0.05);
        --hover-border: rgba(0, 126, 230, 1);
        --hover-glow: rgba(0, 126, 230, 0.15);
        /* 倒计时圆环尺寸 */
        --circle-size: 100px;
        --circle-stroke: 5px;
      }

      body.dark {
        --color: #60a5fa;
        --grad-color: #60a5fa;
        --bg: #0f1117;
        --panel: #181c24;
        --border: #2c3442;
        --text: #f3f4f6;
        --text-sub: #98a2b3;
        --tip-bg: #e8edf4;
        --tip-text: #101317;
        --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.25);
        --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 16px 42px rgba(0, 0, 0, 0.5);
        --hover-border: rgba(97, 166, 250, 1);
        --hover-glow: rgba(96, 165, 250, 0.16);
      }

      /* --- 页面固定居中 --- */
      html,
      body {
        height: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 26px;
        transition: background 0.3s ease;
      }

      /* --- 跳转卡片 --- */
      .redirect-card {
        background: var(--panel);
        max-width: 480px;
        width: 100%;
        padding: 36px 28px 28px;
        border-radius: 18px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        text-align: center;
        animation: fadeUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        max-height: 85vh;
        overflow-y: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .redirect-card::-webkit-scrollbar {
        display: none;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .redirect-icon {
        font-size: 3.2rem;
        display: block;
        margin-bottom: 6px;
      }

      .redirect-card h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 6px;
      }

      .redirect-desc {
        color: var(--text-sub);
        font-size: 0.92rem;
        line-height: 1.5;
        margin-bottom: 22px;
      }

      /* --- 目标网址显示框 --- */
      .redirect-url-box {
        background: var(--bg);
        padding: 12px 16px;
        border-radius: 12px;
        box-shadow: var(--shadow-sm);
        margin-bottom: 28px;
        word-break: break-all;
        font-size: 0.88rem;
        font-weight: 500;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .redirect-url-box span {
        opacity: 0.7;
      }

      /* --- 倒计时圆环 --- */
      .countdown-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-size: 1.1rem;
        color: var(--text-sub);
        margin-bottom: 30px;
      }

      .countdown-circle {
        position: relative;
        width: var(--circle-size);
        height: var(--circle-size);
        flex-shrink: 0;
      }

      .countdown-circle svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .circle-bg {
        fill: none;
        stroke: var(--border);
        stroke-width: var(--circle-stroke);
        opacity: 0.6;
      }

      .circle-progress {
        fill: none;
        stroke: var(--color);
        stroke-width: var(--circle-stroke);
        stroke-linecap: round;
        transition:
          stroke-dashoffset 0.1s ease,
          stroke 0.3s ease;
      }

      .countdown-number {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--color);
        line-height: 1;
        letter-spacing: -0.02em;
        transition: color 0.3s ease;
      }

      .countdown-label {
        font-size: 1rem;
        color: var(--text-sub);
      }

      /* --- 继续按钮 --- */
      .btn-wrap {
        text-align: center;
      }

      .btn-go {
        display: inline-block;
        padding: 8px 18px;
        border: none;
        border-radius: 10px;
        font-size: 1.2rem;
        font-weight: 700;
        cursor: pointer;
        background: var(--grad-color);
        color: #fff;
        box-shadow: 0 2px 8px color-mix(in srgb, var(--color) 28%, transparent);
        transition:
          all 0.25s ease,
          background 0.3s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .btn-go:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px color-mix(in srgb, var(--color) 40%, transparent);
      }

      .btn-go:active {
        transform: scale(0.96);
        box-shadow: 0 2px 8px color-mix(in srgb, var(--color) 28%, transparent);
      }

      /* --- 移动端适配 --- */
      @media (max-width: 480px) {
        .redirect-card {
          padding: 32px 18px 24px;
        }
        .redirect-card h1 {
          font-size: 1.5rem;
        }
        .redirect-desc {
          font-size: 0.85rem;
        }
        .countdown-number {
          font-size: 1.8rem;
        }
        .countdown-label {
          font-size: 0.9rem;
        }
        .btn-go {
          padding: 8px 20px;
          font-size: 1.1rem;
        }
        :root {
          --circle-size: 80px;
          --circle-stroke: 4px;
        }
      }

      @media (max-width: 380px) {
        :root {
          --circle-size: 70px;
          --circle-stroke: 4px;
        }
        .countdown-number {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="redirect-card">
      <span class="redirect-icon">🚀</span>
      <h1>即将离开本站</h1>
      <p class="redirect-desc">
        即将离开星源导航页面，正在前往第三方网站，<br />
        请自行甄别信息真伪，保护好个人隐私
      </p>

      <div class="redirect-url-box">
        <span id="targetDisplay">加载中...</span>
      </div>

      <!-- 倒计时圆环 -->
      <div class="countdown-wrap">
        <div class="countdown-circle">
          <svg viewBox="0 0 120 120">
            <!-- 背景圆环 -->
            <circle class="circle-bg" cx="60" cy="60" r="52" />
            <!-- 进度圆环 -->
            <circle
              class="circle-progress"
              id="progressCircle"
              cx="60"
              cy="60"
              r="52"
              stroke-dasharray="326.726"
              stroke-dashoffset="0"
            />
          </svg>
          <span class="countdown-number" id="countdownNum">10</span>
        </div>
        <span class="countdown-label">秒后自动跳转</span>
      </div>

      <div class="btn-wrap">
        <button class="btn-go" id="goBtn">继续</button>
      </div>
    </div>

    <script>
      (function () {
        // ── 获取并校验目标链接 ──
        const params = new URLSearchParams(window.location.search);
        let targetUrl = params.get("url");

        if (!targetUrl || targetUrl === "null" || targetUrl === "undefined") {
          window.location.replace("/");
          return;
        }

        try {
          targetUrl = decodeURIComponent(targetUrl);
        } catch (e) {}

        if (
          !targetUrl.startsWith("http://") &&
          !targetUrl.startsWith("https://")
        ) {
          if (
            targetUrl.includes("javascript:") ||
            targetUrl.includes("data:")
          ) {
            window.location.replace("/");
            return;
          }
          targetUrl = "https://" + targetUrl;
        }

        // ── 显示友好域名 ──
        try {
          const urlObj = new URL(targetUrl);
          let display = urlObj.hostname;
          if (urlObj.pathname && urlObj.pathname !== "/") {
            display += urlObj.pathname;
          }
          if (display.length > 60) display = display.substring(0, 60) + "…";
          document.getElementById("targetDisplay").textContent = display;
        } catch {
          document.getElementById("targetDisplay").textContent = targetUrl;
        }

        // ── 同步深色模式 ──
        const darkKey = "xingyuan-dark-mode";
        if (localStorage.getItem(darkKey) === "true") {
          document.body.classList.add("dark");
        }

        // ── 倒计时逻辑（带圆环进度） ──
        const TOTAL_SECONDS = 10;
        const CIRCUMFERENCE = 326.726;

        let countdown = TOTAL_SECONDS;
        const countdownEl = document.getElementById("countdownNum");
        const progressCircle = document.getElementById("progressCircle");
        let timer = null;

        function updateCircle(remaining) {
          const offset = CIRCUMFERENCE * (1 - remaining / TOTAL_SECONDS);
          progressCircle.style.strokeDashoffset = offset;
        }

        function startCountdown() {
          if (timer) clearInterval(timer);
          timer = setInterval(function () {
            countdown--;
            countdownEl.textContent = countdown;
            updateCircle(countdown);

            if (countdown <= 0) {
              clearInterval(timer);
              timer = null;
              safeRedirect(targetUrl);
            }
          }, 1000);
        }

        // ── 安全跳转函数 ──
        function safeRedirect(url) {
          try {
            window.location.replace(url);
          } catch (e) {
            window.location.href = url;
          }
        }

        function goNow() {
          if (timer) {
            clearInterval(timer);
            timer = null;
          }
          safeRedirect(targetUrl);
        }

        // ── 绑定事件 ──
        document.getElementById("goBtn").addEventListener("click", goNow);

        document.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            goNow();
          }
        });

        // ── 启动倒计时 ──
        progressCircle.style.strokeDashoffset = 0;
        countdownEl.textContent = TOTAL_SECONDS;
        startCountdown();
      })();
    </script>
  </body>
</html>
