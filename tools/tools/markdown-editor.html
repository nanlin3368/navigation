<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Markdown 编辑器</title>
    <meta
      name="description"
      content="Markdown 编辑器 - 纯本地离线工具，实时双栏预览，支持导入 .md 文件，一键导出精美 HTML 或纯文本 MD 文件，内置代码高亮，数据不上传，隐私无忧。"
    />
    <link
      rel="apple-touch-icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/nav.webp"
    />
    <link
      rel="icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/nav.webp"
      type="image/webp"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <style>
      /* --- 全局变量与设计令牌 --- */
      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --ink: #1d1d1f;
        --sub: #86868b;
        --accent: #0071e3;
        --accent-press: #0059b3;
        --line: rgba(0, 0, 0, 0.08);
        --radius: 18px;
        --radius-sm: 12px;
      }

      /* --- 重置 & 基础排版 --- */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* --- 顶部导航栏入场动画 --- */
      .topbar {
        padding: env(safe-area-inset-top, 0) 0 0 0;
        text-align: center;
        padding-top: max(28px, env(safe-area-inset-top));
        padding-bottom: 18px;
        flex: 0 0 auto;
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .topbar h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .topbar p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--sub);
      }

      /* --- 应用主容器（移动端默认纵向排列） --- */
      .app {
        flex: 1 1 auto;
        width: 100%;
        max-width: 1800px;
        margin: 0 auto;
        padding: 0 20px calc(30px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      /* --- 弹性入场动画 --- */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* 给左右面板加交错入场效果 */
      .panel-left {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
      }
      .panel-right {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.22s both;
      }

      /* --- 桌面端响应式布局（左右等宽双栏） --- */
      @media (min-width: 860px) {
        .app {
          flex-direction: row;
          align-items: stretch;
          padding-bottom: 45px;
        }
        .panel-left,
        .panel-right {
          flex: 1 1 50%;
          min-width: 0;
          display: flex;
          flex-direction: column;
        }
      }

      /* --- 卡片组件 --- */
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 8px 24px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }
      .panel-left,
      .panel-right {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* --- 区块标题与元信息 --- */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0;
        flex: 1;
      }
      .meta-info {
        font-size: 12px;
        color: var(--sub);
        font-family: ui-monospace, SFMono-Regular, monospace;
        white-space: nowrap;
      }

      /* --- 文本编辑区 --- */
      textarea {
        width: 100%;
        flex: 1;
        min-height: 550px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 15px;
        line-height: 1.6;
        color: var(--ink);
        resize: none;
        outline: none;
        transition: border-color 0.2s;
      }
      textarea:focus {
        border-color: var(--accent);
      }
      textarea::placeholder {
        color: var(--sub);
        opacity: 0.6;
      }

      /* --- 预览面板 --- */
      .preview-body {
        width: 100%;
        flex: 1;
        min-height: 550px;
        max-height: 550px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 20px 24px;
        color: var(--ink);
        overflow-y: auto;
      }

      /* --- 操作按钮组 --- */
      .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .btn {
        flex: 1;
        min-width: 100px;
        border: none;
        border-radius: 14px;
        padding: 13px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          background-color 0.15s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:active {
        background: var(--accent-press);
      }
      .btn-secondary {
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn-secondary:hover {
        background: rgba(0, 0, 0, 0.02);
      }
      .btn-danger {
        background: var(--bg);
        color: #ff3b30;
        border: 1px solid rgba(255, 59, 48, 0.25);
      }
      .btn-danger:hover {
        background: rgba(255, 59, 48, 0.04);
      }

      /* --- 隐藏的文件输入 --- */
      #fileInput {
        display: none;
      }

      /* --- Markdown 内置精美排版 --- */
      .md-content h1,
      .md-content h2,
      .md-content h3 {
        margin-top: 0;
        color: var(--ink);
        font-weight: 600;
      }
      .md-content h1 {
        font-size: 24px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
      }
      .md-content h2 {
        font-size: 20px;
        margin-top: 24px;
      }
      .md-content h3 {
        font-size: 17px;
      }
      .md-content p {
        line-height: 1.6;
        font-size: 15px;
        margin: 14px 0;
      }
      .md-content a {
        color: var(--accent);
        text-decoration: none;
      }
      .md-content a:hover {
        text-decoration: underline;
      }
      .md-content code {
        font-family: ui-monospace, monospace;
        background: rgba(0, 0, 0, 0.05);
        padding: 3px 6px;
        border-radius: 6px;
        font-size: 14px;
      }
      .md-content pre {
        background: #f8f9fa;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 14px;
        overflow-x: auto;
      }
      .md-content pre code {
        background: none;
        padding: 0;
        border-radius: 0;
      }
      .md-content blockquote {
        margin: 14px 0;
        padding-left: 16px;
        border-left: 4px solid var(--accent);
        color: var(--sub);
        font-style: italic;
      }
      .md-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 16px 0;
        font-size: 14.5px;
      }
      .md-content th,
      .md-content td {
        border: 1px solid var(--line);
        padding: 10px 12px;
        text-align: left;
      }
      .md-content th {
        background: rgba(0, 0, 0, 0.02);
        font-weight: 600;
      }
      .md-content ul,
      .md-content ol {
        padding-left: 24px;
        line-height: 1.6;
      }

      /* --- 预览占位符 --- */
      .preview-placeholder {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--sub);
        font-size: 14px;
      }

      /* --- 滚动条样式 --- */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 3px;
      }

      /* --- Toast 轻提示 --- */
      .toast {
        position: fixed;
        top: max(18px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%) translateY(-12px);
        background: rgba(28, 28, 30, 0.92);
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        padding: 12px 22px;
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        z-index: 100;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <!-- --- Toast 提示容器 --- -->
    <div class="toast" id="toast">已复制到剪贴板</div>

    <!-- --- 顶部标题栏 --- -->
    <div class="topbar">
      <h1>📝 Markdown 编辑器</h1>
      <p>纯本地安全处理 · 支持实时双栏预览与精美导出</p>
    </div>

    <div class="app">
      <div class="panel-left">
        <div class="card">
          <div class="section-header">
            <p class="section-title">Markdown 源码编辑器</p>
            <span class="meta-info" id="metaText">0 字符 / 0 行</span>
          </div>
          <textarea
            id="mdInput"
            placeholder="在此输入 Markdown 文本，或将 .md 文件拖拽至此..."
            spellcheck="false"
          >
# 欢迎使用精准编辑器 ✨

这是一个纯本地运行的 **Markdown 编辑器**。

### 功能特性：
1. **实时双栏预览**：左侧键入，右侧立刻渲染。
2. **文档数据统计**：精准计算字符数及行数。
3. **安全隐私**：绝不上传任何服务器。

| 导出格式 | 描述 |
| :--- | :--- |
| **导出 MD** | 保存纯文本源文件 |
| **导出 HTML** | 附带精美果味排版样式 |

> 开始撰写你的大作吧！</textarea
          >
          <div class="btn-row">
            <input type="file" id="fileInput" accept=".md,.txt" />
            <button class="btn btn-secondary" id="importBtn">
              导入 MD 文件
            </button>
            <button class="btn btn-danger" id="clearBtn">清空内容</button>
          </div>
        </div>
      </div>

      <div class="panel-right">
        <div class="card">
          <div class="section-header">
            <p class="section-title">实时精美预览效果</p>
          </div>
          <div class="preview-body" id="previewBody">
            <div class="md-content" id="mdContent"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-secondary" id="exportMDBtn">
              💾 导出 .md 文件
            </button>
            <button class="btn btn-primary" id="exportHTMLBtn">
              🌐 一键导出 .html
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // 禁用浏览器的历史滚动恢复，强制每次刷新都回到顶部
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }

      (function () {
        /* --- DOM 元素引用 --- */
        const mdInput = document.getElementById("mdInput");
        const previewBody = document.getElementById("previewBody");
        const mdContent = document.getElementById("mdContent");
        const metaText = document.getElementById("metaText");

        const fileInput = document.getElementById("fileInput");
        const importBtn = document.getElementById("importBtn");
        const clearBtn = document.getElementById("clearBtn");
        const exportMDBtn = document.getElementById("exportMDBtn");
        const exportHTMLBtn = document.getElementById("exportHTMLBtn");
        const toast = document.getElementById("toast");

        /* --- Toast 轻提示逻辑 --- */
        let toastTimer = null;
        function showToast(msg) {
          toast.textContent = msg;
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            toast.classList.remove("show");
          }, 1600);
        }

        /* --- 核心处理函数：更新统计并渲染 Markdown --- */
        function handleInput() {
          const text = mdInput.value;
          if (!text) {
            metaText.textContent = "0 字符 / 0 行";
            mdContent.innerHTML =
              '<div class="preview-placeholder">💡 等待左侧输入 Markdown 数据...</div>';
            return;
          }

          // 更新状态栏
          metaText.textContent = `${text.length} 字符 / ${text.split("\n").length} 行`;

          // 使用 marked 解析 Markdown
          mdContent.innerHTML = marked.parse(text);

          // 触发 Prism 代码高亮
          Prism.highlightAllUnder(mdContent);
        }

        /* --- 文件导入处理 --- */
        function handleFile(file) {
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function (e) {
            mdInput.value = e.target.result;
            handleInput();
            showToast("文件导入成功");
          };
          reader.readAsText(file);
        }

        /* --- 事件绑定：输入实时更新 --- */
        mdInput.addEventListener("input", handleInput);
        importBtn.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", (e) =>
          handleFile(e.target.files[0]),
        );

        /* --- 清空按钮 --- */
        clearBtn.addEventListener("click", () => {
          mdInput.value = "";
          handleInput();
          showToast("已清空");
        });

        /* --- 拖拽文件到编辑区 --- */
        mdInput.addEventListener("dragover", (e) => e.preventDefault());
        mdInput.addEventListener("drop", (e) => {
          e.preventDefault();
          if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]);
          }
        });

        /* --- 通用下载函数 --- */
        function downloadFile(content, filename, contentType) {
          const a = document.createElement("a");
          const file = new Blob([content], { type: contentType });
          a.href = URL.createObjectURL(file);
          a.download = filename;
          a.click();
          URL.revokeObjectURL(a.href);
        }

        /* --- 导出纯 Markdown 文件 --- */
        exportMDBtn.addEventListener("click", () => {
          if (!mdInput.value.trim()) {
            showToast("内容为空，无法导出");
            return;
          }

          const contentWithBOM = "\uFEFF" + mdInput.value;
          const blob = new Blob([contentWithBOM], {
            type: "text/markdown;charset=utf-8;",
          });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "Document.md";
          a.click();
          URL.revokeObjectURL(a.href);
          showToast("MD 文件已开始下载");
        });

        /* --- 导出独立 HTML 页面（含完整样式） --- */
        exportHTMLBtn.addEventListener("click", () => {
          if (!mdInput.value.trim()) {
            showToast("内容为空，无法导出");
            return;
          }

          const htmlRendered = mdContent.innerHTML;
          const fullHtmlTemplate = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导出的文档</title>
<style>
  body {
    background: #f5f5f7;
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 40px 20px;
    margin: 0;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: #ffffff;
    padding: 40px;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    border: 1px solid rgba(0,0,0,0.08);
  }
  h1, h2, h3 { color: #1d1d1f; font-weight: 600; margin-top: 24px; }
  h1 { font-size: 28px; border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 8px; margin-top: 0; }
  p { line-height: 1.6; font-size: 16px; }
  a { color: #0071e3; text-decoration: none; }
  code { font-family: monospace; background: rgba(0,0,0,0.05); padding: 3px 6px; border-radius: 6px; }
  pre { background: #f8f9fa; border: 1px solid rgba(0,0,0,0.08); padding: 14px; border-radius: 12px; overflow-x: auto; }
  blockquote { border-left: 4px solid #0071e3; padding-left: 16px; color: #86868b; margin: 14px 0; font-style: italic; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  th, td { border: 1px solid rgba(0,0,0,0.08); padding: 10px 12px; text-align: left; }
  th { background: rgba(0,0,0,0.02); }
<\/style>
<\/head>
<body>
  <div class="container">
    ${htmlRendered}
  <\/div>
<\/body>
<\/html>`;

          downloadFile(fullHtmlTemplate, "Document.html", "text/html");
          showToast("HTML 精美页面已开始下载");
        });

        // 页面加载时首发初始化渲染
        handleInput();
      })();
    </script>

    <script>
      (function () {
        "use strict";

        function _isDarkMode() {
          var htmlTheme = document.documentElement.getAttribute("data-theme");
          var bodyTheme = document.body
            ? document.body.getAttribute("data-theme")
            : null;
          if (htmlTheme === "dark" || bodyTheme === "dark") return true;
          if (htmlTheme === "light" || bodyTheme === "light") return false;

          if (document.body && document.body.classList.contains("dark"))
            return true;

          try {
            var bg = getComputedStyle(document.documentElement)
              .getPropertyValue("--primary-bg")
              .trim();
            if (bg) {
              var hex = bg.replace("#", "");
              if (hex.length >= 2) {
                return parseInt(hex.substring(0, 2), 16) < 80;
              }
            }
          } catch (err) {}

          return (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          );
        }

        (function _injectUserSelectCSS() {
          var style = document.createElement("style");
          style.id = "security-user-select";
          style.textContent = [
            "body{",
            "  user-select:none;",
            "  -webkit-user-select:none;",
            "  -moz-user-select:none;",
            "  -ms-user-select:none;",
            "}",
            "input,textarea{",
            "  user-select:text;",
            "  -webkit-user-select:text;",
            "}",
          ].join("\n");
          (document.head || document.documentElement).appendChild(style);
        })();

        document.addEventListener("copy", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
            if (e.clipboardData) e.clipboardData.setData("text/plain", "");
          }
        });

        document.addEventListener("cut", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
          }
        });

        document.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });

        document.addEventListener("keydown", function (e) {
          var k = e.key ? e.key.toLowerCase() : "";

          if (e.key === "F12") {
            e.preventDefault();
            return false;
          }

          if (e.ctrlKey && !e.shiftKey && ["u", "s", "p"].includes(k)) {
            e.preventDefault();
            return false;
          }

          if (e.ctrlKey && e.shiftKey && ["i", "j", "c"].includes(k)) {
            e.preventDefault();
            return false;
          }

          var isPrtSc = e.key === "PrintScreen";
          var isMacShot =
            e.metaKey && e.shiftKey && ["3", "4", "5", "6"].includes(e.key);
          var isWinShot = e.key === "PrintScreen" && (e.metaKey || e.altKey);
          if (isPrtSc || isMacShot || isWinShot) {
            _showCaptureOverlay();
            e.preventDefault();
            setTimeout(_hideCaptureOverlay, 400);
          }

          if (
            (e.ctrlKey || e.metaKey) &&
            ["+", "-", "=", "0"].includes(e.key)
          ) {
            e.preventDefault();
            return false;
          }
        });

        var _devToolsBlocked = false;

        function _checkDevTools() {
          var wGap = window.outerWidth - window.innerWidth;
          var hGap = window.outerHeight - window.innerHeight;
          if ((wGap > 160 || hGap > 160) && !_devToolsBlocked) {
            _devToolsBlocked = true;
            var isDark = _isDarkMode();
            var bg = isDark ? "#000000" : "#F2F2F7";
            var fg = isDark ? "#EBEBF5" : "#3C3C43";
            document.body.innerHTML =
              '<div style="display:flex;align-items:center;justify-content:center;' +
              "height:100vh;background:" +
              bg +
              ';font-family:-apple-system,sans-serif;">' +
              '<p style="font-size:18px;color:' +
              fg +
              ';text-align:center;">' +
              "⚠️ 页面加载异常，请刷新后重试</p></div>";
          }
        }

        setInterval(_checkDevTools, 1000);

        var _overlay = null;

        function _showCaptureOverlay() {
          if (_overlay) return;
          _overlay = document.createElement("div");
          _overlay.style.cssText = [
            "position:fixed",
            "inset:0",
            "z-index:2147483647",
            "background:#000",
            "opacity:0",
            "transition:opacity .1s ease",
            "pointer-events:none",
            "will-change:opacity",
          ].join(";");
          document.body.appendChild(_overlay);
          requestAnimationFrame(function () {
            _overlay.style.opacity = "1";
          });
        }

        function _hideCaptureOverlay() {
          if (!_overlay) return;
          _overlay.style.opacity = "0";
          var o = _overlay;
          setTimeout(function () {
            if (o && o.parentNode) o.parentNode.removeChild(o);
            if (_overlay === o) _overlay = null;
          }, 150);
        }

        var _trap = /./;
        _trap.toString = function () {
          return "⚠️ 禁止调试";
        };
        setInterval(function () {
          console.log("%c", _trap);
        }, 2000);

        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );

        document.addEventListener(
          "gesturestart",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gesturechange",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gestureend",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );

        window.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>
  </body>
</html>
