<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>代码对比</title>
    <meta
      name="description"
      content="代码对比工具 - 纯本地安全比对，支持导入 .txt 或代码文件，逐行高亮显示新增(绿)与删除(红)差异，精准快速，数据不上传，隐私无忧。"
    />
    <link
      rel="apple-touch-icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/logo.svg"
    />
    <link
      rel="icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/logo.svg"
      type="image/svg+xml"
    />
    <style>
      /* ── 设计令牌 ── */
      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --ink: #1d1d1f;
        --sub: #86868b;
        --accent: #0071e3;
        --accent-press: #0059b3;
        --line: rgba(0, 0, 0, 0.08);
        --red: #ff3b30;
        --red-bg: rgba(255, 59, 48, 0.09);
        --green-bg: rgba(52, 199, 89, 0.1);
        --radius: 18px;
        --radius-sm: 12px;
      }

      /* ── 基础重置 ── */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ── 顶栏 ── */
      .topbar {
        text-align: center;
        padding: max(28px, env(safe-area-inset-top)) 0 18px;
        flex: 0 0 auto;
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .topbar h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .topbar p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--sub);
      }

      /* ── 主容器与入场动画 ── */
      .app {
        flex: 1 1 auto;
        width: 100%;
        max-width: 1800px;
        margin: 0 auto;
        padding: 0 12px calc(30px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .panel-left {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
      }
      .panel-right {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.22s both;
      }

      /* ── 卡片与面板 ── */
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 8px 24px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }
      .panel-left,
      .panel-right {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* ── 区块标题 ── */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0;
        flex: 1;
      }
      .meta-info {
        font-size: 12px;
        color: var(--sub);
        font-family: ui-monospace, SFMono-Regular, monospace;
        white-space: nowrap;
      }

      /* ── 输入框 ── */
      textarea {
        width: 100%;
        min-height: 240px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 15px;
        line-height: 1.5;
        color: var(--ink);
        resize: none;
        outline: none;
        transition: border-color 0.2s;
      }
      textarea:focus {
        border-color: var(--accent);
      }
      textarea::placeholder {
        color: var(--sub);
        opacity: 0.6;
      }

      /* ── 按钮 ── */
      .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .btn {
        flex: 1;
        min-width: 100px;
        border: none;
        border-radius: 14px;
        padding: 13px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          background-color 0.15s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:active {
        background: var(--accent-press);
      }
      .btn-secondary {
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn-secondary:hover {
        background: rgba(0, 0, 0, 0.02);
      }
      .btn-danger {
        background: var(--bg);
        color: var(--red);
        border: 1px solid var(--line);
      }
      .actions-card .btn-row {
        margin-top: 0;
      }

      /* ── 隐藏文件选择 ── */
      #fileInputA,
      #fileInputB {
        display: none;
      }

      /* ── 结果状态栏 ── */
      .result-card {
        flex: 1;
      }
      .result-status {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 13px 16px;
        font-size: 14px;
        font-weight: 500;
        color: var(--sub);
        margin-bottom: 14px;
      }
      .result-status.done,
      .result-status.same {
        background: var(--green-bg);
        color: #1f8a3d;
        border-color: rgba(52, 199, 89, 0.25);
      }
      .stat-pill {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12.5px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.04);
      }
      .stat-pill.add {
        color: #1f8a3d;
        background: var(--green-bg);
      }
      .stat-pill.del {
        color: #c5271f;
        background: var(--red-bg);
      }
      .stat-pill.same {
        color: var(--sub);
      }

      /* ── 结果面板 ── */
      .result-body {
        flex: 0 0 auto;
        height: 62vh;
        min-height: 420px;
        overflow: auto;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
      }
      .result-placeholder {
        height: 100%;
        min-height: 240px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--sub);
        font-size: 14px;
        text-align: center;
        padding: 30px;
      }

      /* ── diff 行 ── */
      .diff-line {
        display: flex;
        min-width: max-content;
        width: 100%;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13.5px;
        line-height: 1.65;
      }
      .ln {
        flex: 0 0 auto;
        width: 44px;
        text-align: right;
        padding: 0 8px;
        color: var(--sub);
        opacity: 0.55;
        user-select: none;
        border-right: 1px solid var(--line);
        font-variant-numeric: tabular-nums;
      }
      .diff-marker {
        flex: 0 0 auto;
        width: 22px;
        text-align: center;
        user-select: none;
        font-weight: 700;
      }
      .diff-content {
        flex: 1 1 auto;
        white-space: pre;
        padding: 0 14px 0 2px;
      }
      .diff-equal .diff-content {
        color: var(--ink);
      }
      .diff-equal .diff-marker {
        color: var(--sub);
        opacity: 0.4;
      }
      .diff-add {
        background: var(--green-bg);
      }
      .diff-add .diff-marker,
      .diff-add .diff-content {
        color: #1f8a3d;
      }
      .diff-del {
        background: var(--red-bg);
      }
      .diff-del .diff-marker,
      .diff-del .diff-content {
        color: #c5271f;
      }
      .diff-add .ln,
      .diff-del .ln {
        opacity: 0.75;
      }

      /* ── 滚动条 ── */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 3px;
      }

      /* ── Toast ── */
      .toast {
        position: fixed;
        top: max(18px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%) translateY(-12px);
        background: rgba(28, 28, 30, 0.92);
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        padding: 12px 22px;
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        z-index: 100;
        max-width: calc(100vw - 40px);
        text-align: center;
        word-break: break-word;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ── 桌面端双栏 ── */
      @media (min-width: 860px) {
        .app {
          flex-direction: row;
          align-items: stretch;
          padding-bottom: 45px;
        }
        .panel-left {
          flex: 0 0 32%;
          min-width: 0;
          overflow: hidden;
        }
        .panel-right {
          flex: 1 1 68%;
          min-width: 0;
          overflow: hidden;
          align-self: flex-start;
        }
        .result-body {
          height: 820px;
          min-height: 820px;
        }
      }

      /* ── 减少动效 ── */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="topbar">
      <h1>🔍 代码对比</h1>
      <p>纯本地安全比对 · 数据不上传或存储</p>
    </div>

    <div class="app">
      <div class="panel-left">
        <div class="card">
          <div class="section-header">
            <p class="section-title">代码 / 文本 A (左侧原文本)</p>
            <span class="meta-info" id="metaA">0 字符 / 0 行</span>
          </div>
          <textarea
            id="textA"
            placeholder="在此输入或粘贴第一份代码，或拖拽文件到这里..."
            spellcheck="false"
          ></textarea>
          <div class="btn-row">
            <input type="file" id="fileInputA" />
            <button class="btn btn-secondary" id="importA">导入文件 A</button>
            <button class="btn btn-danger" id="clearAOnly">清空 A</button>
          </div>
        </div>

        <div class="card">
          <div class="section-header">
            <p class="section-title">代码 / 文本 B (右侧修改后)</p>
            <span class="meta-info" id="metaB">0 字符 / 0 行</span>
          </div>
          <textarea
            id="textB"
            placeholder="在此输入或粘贴第二份代码，或拖拽文件到这里..."
            spellcheck="false"
          ></textarea>
          <div class="btn-row">
            <input type="file" id="fileInputB" />
            <button class="btn btn-secondary" id="importB">导入文件 B</button>
            <button class="btn btn-danger" id="clearBOnly">清空 B</button>
          </div>
        </div>

        <div class="card actions-card">
          <div class="btn-row">
            <button class="btn btn-secondary" id="clearAll">🧹 全部清空</button>
            <button class="btn btn-primary" id="compareBtn">
              ⚡ 一键精准比对
            </button>
          </div>
        </div>
      </div>

      <div class="panel-right">
        <div class="card result-card">
          <div class="section-header">
            <p class="section-title">比对结果详情</p>
          </div>
          <div class="result-status" id="resultStatus">
            ⏳ 暂未进行比对，请在左侧输入内容后点击“一键精准比对”
          </div>
          <div class="result-body" id="resultBody">
            <div class="result-placeholder" id="resultPlaceholder">
              💡 等待左侧比对数据输入...
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ── 关闭历史滚动恢复 ──
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";

      (function () {
        "use strict";

        // ── DOM 引用 ──
        const textA = document.getElementById("textA");
        const textB = document.getElementById("textB");
        const metaA = document.getElementById("metaA");
        const metaB = document.getElementById("metaB");
        const fileInputA = document.getElementById("fileInputA");
        const fileInputB = document.getElementById("fileInputB");
        const importA = document.getElementById("importA");
        const importB = document.getElementById("importB");
        const clearAOnly = document.getElementById("clearAOnly");
        const clearBOnly = document.getElementById("clearBOnly");
        const clearAll = document.getElementById("clearAll");
        const compareBtn = document.getElementById("compareBtn");
        const resultStatus = document.getElementById("resultStatus");
        const resultBody = document.getElementById("resultBody");
        const toast = document.getElementById("toast");

        // ── 提示条 ──
        let toastTimer = null;
        function showToast(msg) {
          toast.textContent = msg || "操作成功";
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
        }

        // ── 字符 / 行数统计 ──
        function updateMeta(textarea, metaEl) {
          const text = textarea.value;
          metaEl.textContent = text
            ? `${text.length} 字符 / ${text.split("\n").length} 行`
            : "0 字符 / 0 行";
        }

        // ── HTML 转义 ──
        function escapeHtml(s) {
          return s
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        // ── 复位结果面板 ──
        function resetResultPanel() {
          resultStatus.className = "result-status";
          resultStatus.textContent =
            "⏳ 暂未进行比对，请在左侧输入内容后点击“一键精准比对”";
          resultBody.innerHTML =
            '<div class="result-placeholder">💡 等待左侧比对数据输入...</div>';
        }

        // ── 读取文本文件 ──
        function handleFile(file, targetTextarea, metaEl) {
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function (e) {
            targetTextarea.value = e.target.result;
            updateMeta(targetTextarea, metaEl);
            resetResultPanel();
            showToast("文件导入成功，请点击一键精准比对");
          };
          reader.onerror = function () {
            showToast("文件读取失败，请重试");
          };
          reader.readAsText(file);
        }

        // ── Myers 最短编辑路径（记录每步 v 表） ──
        function shortestEditTrace(a, b) {
          const n = a.length,
            m = b.length,
            max = n + m;
          let v = { 1: 0 };
          const trace = [];
          for (let d = 0; d <= max; d++) {
            trace.push(Object.assign({}, v));
            for (let k = -d; k <= d; k += 2) {
              let x;
              if (k === -d || (k !== d && v[k - 1] < v[k + 1])) x = v[k + 1];
              else x = v[k - 1] + 1;
              let y = x - k;
              while (x < n && y < m && a[x] === b[y]) {
                x++;
                y++;
              }
              v[k] = x;
              if (x >= n && y >= m) return trace;
            }
          }
          return trace;
        }

        // ── 回溯操作序列 ──
        function backtrack(a, b, trace) {
          let x = a.length,
            y = b.length;
          const ops = [];
          for (let d = trace.length - 1; d >= 0; d--) {
            const v = trace[d];
            const k = x - y;
            let prevK;
            if (k === -d || (k !== d && v[k - 1] < v[k + 1])) prevK = k + 1;
            else prevK = k - 1;
            const prevX = v[prevK];
            const prevY = prevX - prevK;
            while (x > prevX && y > prevY) {
              ops.push({ type: "equal", aIdx: x - 1, bIdx: y - 1 });
              x--;
              y--;
            }
            if (d > 0) {
              if (x === prevX) ops.push({ type: "add", bIdx: y - 1 });
              else ops.push({ type: "del", aIdx: x - 1 });
            }
            x = prevX;
            y = prevY;
          }
          ops.reverse();
          return ops;
        }

        // ── 按行对比 ──
        function diffLines(aText, bText) {
          const a = aText.split("\n");
          const b = bText.split("\n");
          return { a, b, ops: backtrack(a, b, shortestEditTrace(a, b)) };
        }

        // ── 执行比对并渲染 ──
        function runCompare() {
          const aVal = textA.value;
          const bVal = textB.value;
          if (!aVal.trim() && !bVal.trim()) {
            showToast("请先在左侧输入或导入要比对的内容");
            return;
          }

          const { a, b, ops } = diffLines(aVal, bVal);
          let addCount = 0,
            delCount = 0,
            sameCount = 0;
          let aLine = 0,
            bLine = 0;
          const rows = [];

          ops.forEach((op) => {
            if (op.type === "equal") {
              aLine++;
              bLine++;
              sameCount++;
              rows.push(
                `<div class="diff-line diff-equal">` +
                  `<span class="ln">${aLine}</span>` +
                  `<span class="ln">${bLine}</span>` +
                  `<span class="diff-marker">&nbsp;</span>` +
                  `<span class="diff-content">${escapeHtml(a[op.aIdx]) || " "}</span>` +
                  `</div>`,
              );
            } else if (op.type === "del") {
              aLine++;
              delCount++;
              rows.push(
                `<div class="diff-line diff-del">` +
                  `<span class="ln">${aLine}</span>` +
                  `<span class="ln"></span>` +
                  `<span class="diff-marker">−</span>` +
                  `<span class="diff-content">${escapeHtml(a[op.aIdx]) || " "}</span>` +
                  `</div>`,
              );
            } else if (op.type === "add") {
              bLine++;
              addCount++;
              rows.push(
                `<div class="diff-line diff-add">` +
                  `<span class="ln"></span>` +
                  `<span class="ln">${bLine}</span>` +
                  `<span class="diff-marker">+</span>` +
                  `<span class="diff-content">${escapeHtml(b[op.bIdx]) || " "}</span>` +
                  `</div>`,
              );
            }
          });

          if (addCount === 0 && delCount === 0) {
            resultStatus.className = "result-status same";
            resultStatus.textContent = "✅ 两份内容完全一致，未发现任何差异";
          } else {
            resultStatus.className = "result-status done";
            resultStatus.innerHTML =
              `✅ 比对完成　` +
              `<span class="stat-pill add">+${addCount} 新增</span>` +
              `<span class="stat-pill del">−${delCount} 删除</span>` +
              `<span class="stat-pill same">${sameCount} 行相同</span>`;
          }

          resultBody.innerHTML = rows.join("");
          showToast(
            addCount === 0 && delCount === 0 ? "内容完全一致" : "比对完成",
          );
        }

        // ── 事件绑定 ──
        textA.addEventListener("input", () => updateMeta(textA, metaA));
        textB.addEventListener("input", () => updateMeta(textB, metaB));

        [textA, textB].forEach((ta, idx) => {
          ta.addEventListener("dragover", (e) => e.preventDefault());
          ta.addEventListener("drop", (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) {
              handleFile(
                e.dataTransfer.files[0],
                ta,
                idx === 0 ? metaA : metaB,
              );
            }
          });
        });

        importA.addEventListener("click", () => fileInputA.click());
        importB.addEventListener("click", () => fileInputB.click());
        fileInputA.addEventListener("change", (e) => {
          handleFile(e.target.files[0], textA, metaA);
          fileInputA.value = "";
        });
        fileInputB.addEventListener("change", (e) => {
          handleFile(e.target.files[0], textB, metaB);
          fileInputB.value = "";
        });

        clearAOnly.addEventListener("click", () => {
          textA.value = "";
          fileInputA.value = "";
          updateMeta(textA, metaA);
          resetResultPanel();
          showToast("已清空 A");
        });
        clearBOnly.addEventListener("click", () => {
          textB.value = "";
          fileInputB.value = "";
          updateMeta(textB, metaB);
          resetResultPanel();
          showToast("已清空 B");
        });
        clearAll.addEventListener("click", () => {
          textA.value = "";
          textB.value = "";
          fileInputA.value = "";
          fileInputB.value = "";
          updateMeta(textA, metaA);
          updateMeta(textB, metaB);
          resetResultPanel();
          showToast("已全部清空");
        });

        compareBtn.addEventListener("click", runCompare);
      })();
    </script>

    <script>
      (function () {
        "use strict";

        function _isDarkMode() {
          var htmlTheme = document.documentElement.getAttribute("data-theme");
          var bodyTheme = document.body
            ? document.body.getAttribute("data-theme")
            : null;
          if (htmlTheme === "dark" || bodyTheme === "dark") return true;
          if (htmlTheme === "light" || bodyTheme === "light") return false;
          if (document.body && document.body.classList.contains("dark"))
            return true;
          try {
            var bg = getComputedStyle(document.documentElement)
              .getPropertyValue("--primary-bg")
              .trim();
            if (bg) {
              var hex = bg.replace("#", "");
              if (hex.length >= 2) {
                return parseInt(hex.substring(0, 2), 16) < 80;
              }
            }
          } catch (err) {}
          return (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          );
        }

        (function _injectUserSelectCSS() {
          var style = document.createElement("style");
          style.id = "security-user-select";
          style.textContent = [
            "body{",
            "  user-select:none;",
            "  -webkit-user-select:none;",
            "  -moz-user-select:none;",
            "  -ms-user-select:none;",
            "}",
            "input,textarea{",
            "  user-select:text;",
            "  -webkit-user-select:text;",
            "}",
          ].join("\n");
          (document.head || document.documentElement).appendChild(style);
        })();

        document.addEventListener("copy", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
            if (e.clipboardData) e.clipboardData.setData("text/plain", "");
          }
        });

        document.addEventListener("cut", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
          }
        });

        document.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });

        document.addEventListener("keydown", function (e) {
          var key = (e.key || "").toLowerCase();

          if (e.ctrlKey || e.metaKey) {
            if (key === "s") {
              e.preventDefault();
              return false;
            }

            if (["+", "-", "=", "0"].includes(e.key)) {
              e.preventDefault();
              return false;
            }
          }
        });

        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );

        document.addEventListener(
          "gesturestart",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gesturechange",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gestureend",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );

        window.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>
  </body>
</html>
