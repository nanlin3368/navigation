<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>汉字转拼音</title>
    <meta
      name="description"
      content="汉字转拼音工具 - 纯本地安全转换，支持拼音在汉字上方、纯拼音、汉字(拼音)混合三种模式，声调可标符号、数字或无声调，支持导入 .txt 文件，导出纯文本或精美网页，无需联网，隐私无忧。"
    />
    <link
      rel="apple-touch-icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/logo.svg"
    />
    <link
      rel="icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/logo.svg"
      type="image/svg+xml"
    />
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.js"></script>
    <style>
      /* ── 设计令牌 ── */
      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --ink: #1d1d1f;
        --sub: #86868b;
        --accent: #0071e3;
        --accent-press: #0059b3;
        --line: rgba(0, 0, 0, 0.08);
        --radius: 18px;
        --radius-sm: 12px;
      }

      /* ── 基础重置 ── */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      /* ── 顶栏 ── */
      .topbar {
        text-align: center;
        padding: max(28px, env(safe-area-inset-top)) 0 18px;
        flex: 0 0 auto;
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .topbar h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .topbar p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--sub);
      }

      /* ── 主容器与入场动画 ── */
      .app {
        flex: 1 1 auto;
        width: 100%;
        max-width: 1800px;
        margin: 0 auto;
        padding: 0 20px calc(30px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .panel-config,
      .panel-left {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
      }
      .panel-content,
      .panel-right {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.22s both;
      }

      /* ── 卡片与面板 ── */
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 8px 24px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }
      .flex-card {
        flex: 1;
      }
      .panel-config,
      .panel-content {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .panel-left,
      .panel-right {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* ── 区块标题 ── */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0;
        flex: 1;
      }
      .meta-info {
        font-size: 12px;
        color: var(--sub);
        font-family: ui-monospace, SFMono-Regular, monospace;
        white-space: nowrap;
      }

      /* ── 配置选项组 ── */
      .opt-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
      }
      .opt-group:last-child {
        margin-bottom: 0;
      }
      .opt-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
      }
      .btn-toggle-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn-tab {
        flex: 1;
        min-width: 80px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 500;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all 0.15s ease;
        text-align: center;
      }
      .btn-tab.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      /* ── 文本编辑区 ── */
      textarea {
        width: 100%;
        flex: 1;
        min-height: 550px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 16px;
        font-size: 16px;
        line-height: 1.6;
        color: var(--ink);
        resize: none;
        outline: none;
        transition: border-color 0.2s;
        overflow-y: auto;
      }
      textarea:focus {
        border-color: var(--accent);
      }
      textarea::placeholder {
        color: var(--sub);
        opacity: 0.6;
      }

      /* ── 预览面板 ── */
      .preview-body {
        width: 100%;
        flex: 1;
        min-height: 550px;
        max-height: 550px;
        overflow-y: auto;
        overflow-x: hidden;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 20px;
        color: var(--ink);
      }
      .pinyin-content {
        line-height: 3.2;
        font-size: 18px;
        word-break: break-word;
        white-space: pre-wrap;
      }
      .pinyin-content ruby {
        font-size: 18px;
        margin: 0 1px;
        ruby-align: center;
      }
      .pinyin-content rt {
        font-size: 12px;
        color: var(--accent);
        line-height: 1;
        font-family: ui-monospace, Monaco, "Andale Mono", monospace;
        letter-spacing: 0.02em;
        user-select: none;
      }
      .pinyin-text-only {
        font-family: ui-monospace, Monaco, monospace;
        letter-spacing: 0.03em;
        color: var(--accent);
        line-height: 1.8;
      }
      .pinyin-mix {
        letter-spacing: 0.02em;
        line-height: 1.8;
      }
      .preview-placeholder {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--sub);
        font-size: 14px;
      }

      /* ── 按钮 ── */
      .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .btn {
        flex: 1;
        min-width: 100px;
        border: none;
        border-radius: 14px;
        padding: 13px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          background-color 0.15s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:active {
        background: var(--accent-press);
      }
      .btn-secondary {
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn-secondary:hover {
        background: rgba(0, 0, 0, 0.02);
      }
      .btn-danger {
        background: var(--bg);
        color: #ff3b30;
        border: 1px solid rgba(255, 59, 48, 0.25);
      }
      .btn-danger:hover {
        background: rgba(255, 59, 48, 0.04);
      }

      /* ── 隐藏文件输入 ── */
      #fileInput {
        display: none;
      }

      /* ── 滚动条 ── */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 3px;
      }

      /* ── Toast ── */
      .toast {
        position: fixed;
        top: max(18px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%) translateY(-12px);
        background: rgba(28, 28, 30, 0.92);
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        padding: 12px 22px;
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        z-index: 100;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ── 桌面端双栏 ── */
      @media (min-width: 860px) {
        .app {
          flex-direction: column;
          gap: 18px;
          padding-bottom: 40px;
        }
        .panel-config {
          flex-direction: row;
          align-items: stretch;
          gap: 18px;
        }
        .panel-config .card {
          flex: 1;
        }
        .panel-content {
          display: flex;
          flex-direction: row;
          gap: 18px;
          align-items: stretch;
        }
        .panel-left,
        .panel-right {
          flex: 1 1 50%;
          min-width: 0;
        }
        .card {
          min-height: 0;
        }
        textarea {
          min-height: 550px;
        }
        .preview-body {
          flex: 1;
          height: auto;
          min-height: 550px;
          overflow-y: auto;
        }
      }

      /* ── 减少动效 ── */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="toast" id="toast">已复制到剪贴板</div>

    <div class="topbar">
      <h1>📝 汉字转拼音</h1>
      <p>纯本地安全处理 · 支持多种排版模式与一键导出</p>
    </div>

    <div class="app">
      <div class="panel-config">
        <div class="card" style="flex: 1">
          <div class="opt-group">
            <span class="opt-label">展示模式</span>
            <div class="btn-toggle-row" id="modeOptions">
              <button class="btn-tab active" data-value="ruby">
                拼音在汉字上方
              </button>
              <button class="btn-tab" data-value="pure">仅显示纯拼音</button>
              <button class="btn-tab" data-value="mix">汉字(拼音) 混合</button>
            </div>
          </div>
        </div>
        <div class="card" style="flex: 1">
          <div class="opt-group">
            <span class="opt-label">声调样式</span>
            <div class="btn-toggle-row" id="toneOptions">
              <button class="btn-tab active" data-value="symbol">
                标准符号声调 (ā)
              </button>
              <button class="btn-tab" data-value="num">
                数字尾随声调 (a1)
              </button>
              <button class="btn-tab" data-value="none">无声调 (a)</button>
            </div>
          </div>
        </div>
      </div>

      <div class="panel-content">
        <div class="panel-left">
          <div class="card flex-card">
            <div class="section-header">
              <p class="section-title">汉字输入源</p>
              <span class="meta-info" id="metaText">0 字</span>
            </div>
            <textarea
              id="zhInput"
              placeholder="在此输入或粘贴汉字，或者将 .txt 文件导入至此..."
              spellcheck="false"
            >
你好，世界！欢迎使用智能拼音转换工具。</textarea
            >
            <div class="btn-row">
              <input type="file" id="fileInput" accept=".txt" />
              <button class="btn btn-secondary" id="importBtn">
                导入 TXT 文件
              </button>
              <button class="btn btn-danger" id="clearBtn">清空内容</button>
            </div>
          </div>
        </div>

        <div class="panel-right">
          <div class="card flex-card">
            <div class="section-header">
              <p class="section-title">实时拼音转换预览效果</p>
            </div>
            <div class="preview-body">
              <div class="pinyin-content" id="pinyinContent"></div>
            </div>
            <div class="btn-row">
              <button class="btn btn-secondary" id="exportTXTBtn">
                导出 .txt 纯文本
              </button>
              <button class="btn btn-primary" id="exportHTMLBtn">
                导出 .html 网页
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ── 关闭历史滚动恢复 ──
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }

      (function () {
        // ── DOM 引用 ──
        const zhInput = document.getElementById("zhInput");
        const pinyinContent = document.getElementById("pinyinContent");
        const metaText = document.getElementById("metaText");

        const fileInput = document.getElementById("fileInput");
        const importBtn = document.getElementById("importBtn");
        const clearBtn = document.getElementById("clearBtn");
        const exportTXTBtn = document.getElementById("exportTXTBtn");
        const exportHTMLBtn = document.getElementById("exportHTMLBtn");
        const toast = document.getElementById("toast");

        // ── 状态变量 ──
        let currentMode = "ruby";
        let currentTone = "symbol";

        // ── 通用提示 ──
        let toastTimer = null;
        function showToast(msg) {
          toast.textContent = msg;
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            toast.classList.remove("show");
          }, 1600);
        }

        // ── 初始化切换按钮组 ──
        function initToggleButtons(containerId, callback) {
          const container = document.getElementById(containerId);
          const buttons = container.querySelectorAll(".btn-tab");
          buttons.forEach((btn) => {
            btn.addEventListener("click", () => {
              buttons.forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              callback(btn.getAttribute("data-value"));
            });
          });
        }

        initToggleButtons("modeOptions", (val) => {
          currentMode = val;
          handleConvert();
        });
        initToggleButtons("toneOptions", (val) => {
          currentTone = val;
          handleConvert();
        });

        // ── 生成汉字及拼音数据 ──
        function generatePinyinData(text, toneType) {
          const result = pinyinPro.pinyin(text, {
            toneType: toneType,
            type: "all",
            nonZh: "keep",
          });
          return result.map((item) => ({
            char: item.origin,
            pinyin: item.pinyin || "",
            isChinese: /[\u4e00-\u9fa5]/.test(item.origin),
          }));
        }

        // ── 核心转换 ──
        function handleConvert() {
          const text = zhInput.value;
          if (!text.trim()) {
            metaText.textContent = "0 字";
            pinyinContent.innerHTML =
              '<div class="preview-placeholder">💡 等待输入汉字数据...</div>';
            return;
          }
          metaText.textContent = `${text.length} 字`;
          let toneType = currentTone;
          let resultHTML = "";

          if (currentMode === "pure") {
            const py = pinyinPro.pinyin(text, {
              toneType: toneType,
              nonZh: "consecutive",
            });
            resultHTML = `<div class="pinyin-text-only">${py}</div>`;
          } else {
            const pinyinData = generatePinyinData(text, toneType);
            if (currentMode === "mix") {
              const htmlArray = pinyinData.map((item) => {
                if (item.isChinese) {
                  return `${item.char}(${item.pinyin})`;
                }
                return item.char;
              });
              resultHTML = `<div class="pinyin-mix">${htmlArray.join("")}</div>`;
            } else {
              const htmlArray = pinyinData.map((item) => {
                if (item.isChinese) {
                  return `<ruby>${item.char}<rt>${item.pinyin}</rt></ruby>`;
                }
                if (item.char === "\n") {
                  return "<br>\n";
                }
                return `<span>${item.char.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span>`;
              });
              resultHTML = htmlArray.join("");
            }
          }
          pinyinContent.innerHTML = resultHTML;
        }

        // ── 文件读取 ──
        function handleFile(file) {
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function (e) {
            zhInput.value = e.target.result;
            handleConvert();
            showToast("TXT 文件导入成功");
          };
          reader.readAsText(file);
        }

        // ── 事件绑定：输入与导入 ──
        zhInput.addEventListener("input", handleConvert);
        importBtn.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", (e) =>
          handleFile(e.target.files[0]),
        );
        clearBtn.addEventListener("click", () => {
          zhInput.value = "";
          handleConvert();
          showToast("已清空内容");
        });
        zhInput.addEventListener("dragover", (e) => e.preventDefault());
        zhInput.addEventListener("drop", (e) => {
          e.preventDefault();
          if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]);
          }
        });

        // ── 通用下载 ──
        function downloadFile(content, filename, contentType) {
          const a = document.createElement("a");
          const file = new Blob([new Uint8Array([0xef, 0xbb, 0xbf]), content], {
            type: contentType,
          });
          a.href = URL.createObjectURL(file);
          a.download = filename;
          a.click();
          URL.revokeObjectURL(a.href);
        }

        // ── 导出 .txt 纯文本 ──
        exportTXTBtn.addEventListener("click", () => {
          const rawText = zhInput.value;
          if (!rawText.trim()) {
            showToast("内容为空，无法导出");
            return;
          }
          let toneType = currentTone;
          let txtContent = "";
          if (currentMode === "pure") {
            txtContent = pinyinPro.pinyin(rawText, {
              toneType: toneType,
              nonZh: "consecutive",
            });
          } else if (currentMode === "mix") {
            const pinyinData = generatePinyinData(rawText, toneType);
            txtContent = pinyinData
              .map((item) =>
                item.isChinese ? `${item.char}(${item.pinyin})` : item.char,
              )
              .join("");
          } else {
            const lines = rawText.split("\n");
            const formattedLines = lines.map((line) => {
              if (!line.trim()) return "";
              const pinyinData = generatePinyinData(line, toneType);
              const pyParts = pinyinData.map((item) =>
                item.isChinese ? item.pinyin : item.char,
              );
              const chParts = pinyinData.map((item) => item.char);
              return `[拼音]: ${pyParts.join(" ")}\n[原字]: ${chParts.join("")}`;
            });
            txtContent = formattedLines.join("\n\n");
          }
          downloadFile(
            txtContent,
            "拼音转换结果.txt",
            "text/plain;charset=utf-8",
          );
          showToast("TXT 文本导出成功");
        });

        // ── 导出 .html 精美网页 ──
        exportHTMLBtn.addEventListener("click", () => {
          if (!zhInput.value.trim()) {
            showToast("内容为空，无法导出");
            return;
          }
          const renderedBody = pinyinContent.innerHTML.trim();
          const fullHtmlTemplate = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导出的精美拼音文档</title>
<style>
  :root {
    --bg-color: #f5f5f7;
    --card-color: #ffffff;
    --text-color: #1d1d1f;
    --accent-color: #0071e3;
    --line-color: rgba(0,0,0,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #1c1c1e;
      --card-color: #2c2c2e;
      --text-color: #f5f5f7;
      --accent-color: #0a84ff;
      --line-color: rgba(255,255,255,0.12);
    }
  }
  body {
    background: var(--bg-color);
    color: var(--text-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 30px 15px;
    margin: 0;
    line-height: 1.6;
  }
  .container {
    max-width: 860px;
    margin: 0 auto;
    background: var(--card-color);
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    border: 1px solid var(--line-color);
  }
  .pinyin-document {
    font-size: 19px;
    line-height: 3.2;
    word-break: break-word;
  }
  .pinyin-document > * {
    white-space: pre-wrap;
  }
  .pinyin-document ruby {
    margin: 0 1px;
    ruby-align: center;
  }
  .pinyin-document rt {
    font-size: 12px;
    color: var(--accent-color);
    line-height: 1;
    font-family: ui-monospace, Monaco, monospace;
    letter-spacing: 0.02em;
  }
  .pinyin-text-only { color: var(--accent-color); font-family: ui-monospace, monospace; letter-spacing: 0.04em; line-height: 1.8; }
  .pinyin-mix { letter-spacing: 0.02em; line-height: 1.8; }
<\/style>
<\/head>
<body>
  <div class="container">
    <div class="pinyin-document">${renderedBody}</div>
  </div>
<\/body>
<\/html>`;

    <script>
      (function () {
        "use strict";

        function _isDarkMode() {
          var htmlTheme = document.documentElement.getAttribute("data-theme");
          var bodyTheme = document.body
            ? document.body.getAttribute("data-theme")
            : null;
          if (htmlTheme === "dark" || bodyTheme === "dark") return true;
          if (htmlTheme === "light" || bodyTheme === "light") return false;
          if (document.body && document.body.classList.contains("dark"))
            return true;
          try {
            var bg = getComputedStyle(document.documentElement)
              .getPropertyValue("--primary-bg")
              .trim();
            if (bg) {
              var hex = bg.replace("#", "");
              if (hex.length >= 2) {
                return parseInt(hex.substring(0, 2), 16) < 80;
              }
            }
          } catch (err) {}
          return (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          );
        }

        (function _injectUserSelectCSS() {
          var style = document.createElement("style");
          style.id = "security-user-select";
          style.textContent = [
            "body{",
            "  user-select:none;",
            "  -webkit-user-select:none;",
            "  -moz-user-select:none;",
            "  -ms-user-select:none;",
            "}",
            "input,textarea{",
            "  user-select:text;",
            "  -webkit-user-select:text;",
            "}",
          ].join("\n");
          (document.head || document.documentElement).appendChild(style);
        })();

        document.addEventListener("copy", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
            if (e.clipboardData) e.clipboardData.setData("text/plain", "");
          }
        });

        document.addEventListener("cut", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
          }
        });

        document.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });

        document.addEventListener("keydown", function (e) {
          var key = (e.key || "").toLowerCase();

          if (e.ctrlKey || e.metaKey) {
            if (key === "s") {
              e.preventDefault();
              return false;
            }

            if (["+", "-", "=", "0"].includes(e.key)) {
              e.preventDefault();
              return false;
            }
          }
        });

        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );

        document.addEventListener(
          "gesturestart",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gesturechange",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gestureend",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );

        window.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>
