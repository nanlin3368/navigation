<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>特殊符号大全</title>
    <meta
      name="description"
      content="特殊符号大全 - 纯本地离线工具，按箭头、数学、货币、标点等 15+ 分类收录数千个特殊符号，点击即可一键复制，无需联网，快捷查找。"
    />
    <link
      rel="apple-touch-icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/logo.svg"
    />
    <link
      rel="icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/logo.svg"
      type="image/svg+xml"
    />
    <style>
      /* ── 设计令牌 ── */
      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --ink: #1d1d1f;
        --sub: #86868b;
        --accent: #0071e3;
        --accent-press: #0059b3;
        --line: rgba(0, 0, 0, 0.08);
        --radius: 18px;
        --radius-sm: 12px;
      }

      /* ── 基础重置 ── */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        scrollbar-gutter: stable;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ── 顶栏 ── */
      .topbar {
        text-align: center;
        padding: max(28px, env(safe-area-inset-top)) 0 18px;
        flex: 0 0 auto;
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .topbar h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .topbar p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--sub);
      }

      /* ── 主容器与入场动画 ── */
      .app {
        flex: 1 1 auto;
        width: 100%;
        max-width: 1800px;
        margin: 0 auto;
        padding: 0 12px calc(30px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .panel-settings {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
      }
      .panel-results {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.22s both;
      }

      /* ── 卡片与面板 ── */
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 8px 24px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }
      .panel-settings,
      .panel-results {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* ── 区块标题 ── */
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0 0 14px;
      }

      /* ── 分类按钮（移动端 3 列网格） ── */
      .category-group {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .cat-btn {
        width: 100%;
        text-align: center;
        padding: 10px 6px;
        border: 1px solid transparent;
        background: var(--bg);
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
        cursor: pointer;
        transition: all 0.15s ease;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cat-btn:hover {
        background: rgba(0, 0, 0, 0.03);
      }
      .cat-btn.active {
        background: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      /* ── 桌面端顶部胶囊分类条（默认隐藏，支持横向滑动） ── */
      .category-bar-wrap {
        display: none;
        position: relative;
        margin: 0 0 16px;
      }
      .category-bar {
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 2px;
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* 旧 Edge/IE */
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        cursor: grab;
      }
      .category-bar::-webkit-scrollbar {
        display: none;
      }
      .category-bar.dragging {
        cursor: grabbing;
      }
      .category-bar.dragging .cat-btn {
        pointer-events: none;
      }
      .category-bar .cat-btn {
        flex: 0 0 auto;
        width: auto;
        padding: 8px 18px;
        border-radius: 999px;
        font-size: 13px;
      }

      /* 两侧渐隐遮罩：提示「还可以继续滑」 */
      .category-bar-wrap::before,
      .category-bar-wrap::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 2px;
        width: 28px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
        z-index: 2;
      }
      .category-bar-wrap::before {
        left: 0;
        background: linear-gradient(
          to right,
          var(--card) 15%,
          rgba(255, 255, 255, 0)
        );
      }
      .category-bar-wrap::after {
        right: 0;
        background: linear-gradient(
          to left,
          var(--card) 15%,
          rgba(255, 255, 255, 0)
        );
      }
      .category-bar-wrap.can-scroll-left::before,
      .category-bar-wrap.can-scroll-right::after {
        opacity: 1;
      }

      /* ── 符号列表与分组 ── */
      .symbol-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .symbol-group {
        display: flex;
        flex-direction: column;
      }
      .group-title {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--sub);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .group-title::after {
        content: "";
        flex: 1 1 auto;
        height: 1px;
        background: var(--line);
      }
      .group-count {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
        background: rgba(0, 113, 227, 0.08);
        padding: 2px 8px;
        border-radius: 999px;
      }

      /* ── 符号网格 ── */
      .emoji-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
        gap: 10px;
        padding: 4px 0;
      }
      .emoji-item {
        background: var(--bg);
        border-radius: var(--radius-sm);
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 500;
        cursor: pointer;
        transition:
          transform 0.1s ease,
          background-color 0.15s;
        user-select: none;
        border: 1px solid transparent;
      }
      .emoji-item:hover {
        background: rgba(0, 0, 0, 0.04);
        transform: scale(1.06);
      }
      .emoji-item:active {
        transform: scale(0.95);
        background: var(--line);
      }
      .emoji-card {
        flex: 1;
      }

      /* ── 滚动容器 ── */
      .emoji-container-scroll {
        max-height: 560px;
        overflow-y: auto;
        padding-right: 6px;
      }

      /* ── 滚动条 ── */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 3px;
      }

      /* ── Toast ── */
      .toast {
        position: fixed;
        top: max(18px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%) translateY(-12px);
        background: rgba(28, 28, 30, 0.92);
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        padding: 12px 22px;
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        z-index: 100;
        max-width: calc(100vw - 40px);
        text-align: center;
        word-break: break-word;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ── 桌面端双栏（≥860px） ── */
      @media (min-width: 860px) {
        .app {
          flex-direction: row;
          align-items: flex-start;
          padding-bottom: 45px;
        }
        .panel-settings {
          display: none;
        }
        .category-bar-wrap {
          display: block;
        }
        .panel-results {
          flex: 1 1 auto;
          min-width: 0;
        }
        .emoji-container-scroll {
          height: 550px;
          max-height: none;
        }
        .symbol-list {
          gap: 28px;
        }
      }

      /* ── 减少动效 ── */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

    <div class="topbar">
      <h1>🔣 特殊符号大全</h1>
      <p>纯本地分类快捷查阅 · 点击图标秒级复制</p>

          <div class="emoji-container-scroll">

        const ALL_INDEX = -1;
        const TOTAL = SYMBOL_DATA.reduce((sum, c) => sum + c.symbols.length, 0);

        // ── DOM 引用 ──
        const categorySelector = document.getElementById("categorySelector");
        const categoryBar = document.getElementById("categoryBar");
        const categoryBarWrap = document.getElementById("categoryBarWrap");
        const emojiGrid = document.getElementById("emojiGrid");
        const gridTitle = document.getElementById("gridTitle");
        const toast = document.getElementById("toast");

        // ── 状态：默认选中「全部」 ──
        let activeIndex = ALL_INDEX;

        // ── 提示条 ──
        let toastTimer = null;
        function showToast(msg) {
          toast.textContent = msg || "操作成功";
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
        }

        // ── 剪贴板 ──
        function copyToClipboard(text) {
          if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
          }
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          return Promise.resolve();
        }

        // ── 单个符号卡片 HTML ──
        function itemHTML(sym) {
          return `<div class="emoji-item" title="点击复制 ${sym}">${sym}</div>`;
        }

        // ── 渲染符号 ──
        function renderSymbols(index) {
          if (index === ALL_INDEX) {
            gridTitle.textContent = `全部符号 (${TOTAL})`;
            emojiGrid.innerHTML = SYMBOL_DATA.map(
              (cat) => `
                <section class="symbol-group">
                  <p class="group-title">
                    ${cat.name}
                    <span class="group-count">${cat.symbols.length}</span>
                  </p>
                  <div class="emoji-grid">${cat.symbols.map(itemHTML).join("")}</div>
                </section>`,
            ).join("");
          } else {
            const category = SYMBOL_DATA[index];
            gridTitle.textContent = `${category.name} (${category.symbols.length})`;
            emojiGrid.innerHTML = `<div class="emoji-grid">${category.symbols
              .map(itemHTML)
              .join("")}</div>`;
          }

          emojiGrid.querySelectorAll(".emoji-item").forEach((item) => {
            item.addEventListener("click", () => {
              const symStr = item.textContent;
              copyToClipboard(symStr).then(() =>
                showToast(`✅ 成功复制符号: ${symStr}`),
              );
            });
          });
        }

        // ── 同步两侧按钮激活态 ──
        function syncActive() {
          document.querySelectorAll(".cat-btn").forEach((btn) => {
            btn.classList.toggle(
              "active",
              parseInt(btn.dataset.index, 10) === activeIndex,
            );
          });
        }

        // ── 渲染分类 ──
        function renderCategories() {
          const allBtn = `<button class="cat-btn" data-index="${ALL_INDEX}">全部</button>`;
          const base = SYMBOL_DATA.map(
            (cat, idx) =>
              `<button class="cat-btn" data-index="${idx}">${cat.name}</button>`,
          ).join("");

          categorySelector.innerHTML = allBtn + base;
          categoryBar.innerHTML = allBtn + base;

          document.querySelectorAll(".cat-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              activeIndex = parseInt(btn.dataset.index, 10);
              syncActive();
              renderSymbols(activeIndex);
            });
          });

          syncActive();
        }

        // ── 桌面端分类条：横向滑动增强 ──
        function initCategoryBarScroll() {
          if (!categoryBar || !categoryBarWrap) return;

          let rafId = null;

          function updateEdgeFade() {
            rafId = null;
            const maxScroll = categoryBar.scrollWidth - categoryBar.clientWidth;
            if (maxScroll <= 1) {
              categoryBarWrap.classList.remove(
                "can-scroll-left",
                "can-scroll-right",
              );
              return;
            }
            categoryBarWrap.classList.toggle(
              "can-scroll-left",
              categoryBar.scrollLeft > 1,
            );
            categoryBarWrap.classList.toggle(
              "can-scroll-right",
              categoryBar.scrollLeft < maxScroll - 1,
            );
          }

          function scheduleEdgeFade() {
            if (rafId === null) rafId = requestAnimationFrame(updateEdgeFade);
          }

          categoryBar.addEventListener("scroll", scheduleEdgeFade, {
            passive: true,
          });
          window.addEventListener("resize", scheduleEdgeFade);

          if (typeof ResizeObserver !== "undefined") {
            new ResizeObserver(scheduleEdgeFade).observe(categoryBar);
          }

          // ── 滚轮 → 横向 ──
          categoryBar.addEventListener(
            "wheel",
            (e) => {
              const maxScroll =
                categoryBar.scrollWidth - categoryBar.clientWidth;
              if (maxScroll <= 1) return;

              const delta =
                Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
              if (!delta) return;

              const atStart = categoryBar.scrollLeft <= 0 && delta < 0;
              const atEnd =
                categoryBar.scrollLeft >= maxScroll - 1 && delta > 0;
              if (atStart || atEnd) return;

              e.preventDefault();
              categoryBar.scrollLeft += delta;
              scheduleEdgeFade();
            },
            { passive: false },
          );

          // ── 鼠标拖拽 ──
          let dragId = null;
          let startX = 0;
          let startScrollLeft = 0;
          let dragged = false;
          let suppressClick = false;
          let suppressTimer = null;

          categoryBar.addEventListener("pointerdown", (e) => {
            if (e.pointerType !== "mouse" || e.button !== 0) return;
            dragId = e.pointerId;
            startX = e.clientX;
            startScrollLeft = categoryBar.scrollLeft;
            dragged = false;
          });

          categoryBar.addEventListener("pointermove", (e) => {
            if (dragId === null || e.pointerId !== dragId) return;
            const dx = e.clientX - startX;
            if (!dragged) {
              if (Math.abs(dx) < 5) return;
              dragged = true;
              categoryBar.classList.add("dragging");
              categoryBar.setPointerCapture(dragId);
            }
            categoryBar.scrollLeft = startScrollLeft - dx;
            e.preventDefault();
            scheduleEdgeFade();
          });

          function endDrag(e) {
            if (dragId === null || (e && e.pointerId !== dragId)) return;
            categoryBar.classList.remove("dragging");
            if (
              categoryBar.hasPointerCapture &&
              categoryBar.hasPointerCapture(dragId)
            ) {
              categoryBar.releasePointerCapture(dragId);
            }
            if (dragged) {
              suppressClick = true;
              clearTimeout(suppressTimer);
              suppressTimer = setTimeout(() => {
                suppressClick = false;
              }, 350);
            }
            dragId = null;
            dragged = false;
          }

          categoryBar.addEventListener("pointerup", endDrag);
          categoryBar.addEventListener("pointercancel", endDrag);

          categoryBar.addEventListener(
            "click",
            (e) => {
              if (!suppressClick) return;
              e.preventDefault();
              e.stopPropagation();
              suppressClick = false;
              clearTimeout(suppressTimer);
            },
            true,
          );

          scheduleEdgeFade();
        }

        // ── 初始化 ──
        renderCategories();
        renderSymbols(activeIndex);
        initCategoryBarScroll();
      })();
    </script>

    <script>
      (function () {
        "use strict";

        function _isDarkMode() {
          var htmlTheme = document.documentElement.getAttribute("data-theme");
          var bodyTheme = document.body
            ? document.body.getAttribute("data-theme")
            : null;
          if (htmlTheme === "dark" || bodyTheme === "dark") return true;
          if (htmlTheme === "light" || bodyTheme === "light") return false;
          if (document.body && document.body.classList.contains("dark"))
            return true;
          try {
            var bg = getComputedStyle(document.documentElement)
              .getPropertyValue("--primary-bg")
              .trim();
            if (bg) {
              var hex = bg.replace("#", "");
              if (hex.length >= 2) {
                return parseInt(hex.substring(0, 2), 16) < 80;
              }
            }
          } catch (err) {}
          return (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          );
        }

        (function _injectUserSelectCSS() {
          var style = document.createElement("style");
          style.id = "security-user-select";
          style.textContent = [
            "body{",
            "  user-select:none;",
            "  -webkit-user-select:none;",
            "  -moz-user-select:none;",
            "  -ms-user-select:none;",
            "}",
            "input,textarea{",
            "  user-select:text;",
            "  -webkit-user-select:text;",
            "}",
          ].join("\n");
          (document.head || document.documentElement).appendChild(style);
        })();

        document.addEventListener("copy", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
            if (e.clipboardData) e.clipboardData.setData("text/plain", "");
          }
        });

        document.addEventListener("cut", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
          }
        });

        document.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });

        document.addEventListener("keydown", function (e) {
          var key = (e.key || "").toLowerCase();

          if (e.ctrlKey || e.metaKey) {
            if (key === "s") {
              e.preventDefault();
              return false;
            }

            if (["+", "-", "=", "0"].includes(e.key)) {
              e.preventDefault();
              return false;
            }
          }
        });

        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );

        document.addEventListener(
          "gesturestart",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gesturechange",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gestureend",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );

        window.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>
  </body>
