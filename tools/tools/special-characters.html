<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>特殊符号大全</title>
    <meta
      name="description"
      content="特殊符号大全 - 纯本地离线工具，按箭头、数学、货币、标点等 15+ 分类收录数千个特殊符号，点击即可一键复制，无需联网，快捷查找。"
    />
    <link
      rel="apple-touch-icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/nav.webp"
    />
    <link
      rel="icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/nav.webp"
      type="image/webp"
    />
    <style>
      /* --- 全局变量与设计令牌 --- */
      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --ink: #1d1d1f;
        --sub: #86868b;
        --accent: #0071e3;
        --accent-press: #0059b3;
        --line: rgba(0, 0, 0, 0.08);
        --radius: 18px;
        --radius-sm: 12px;
      }

      /* --- 重置 & 基础排版 --- */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* --- 顶部导航栏入场动画 --- */
      .topbar {
        padding: env(safe-area-inset-top, 0) 0 0 0;
        text-align: center;
        padding-top: max(28px, env(safe-area-inset-top));
        padding-bottom: 18px;
        flex: 0 0 auto;
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .topbar h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .topbar p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--sub);
      }

      /* --- 主应用容器（移动端默认纵向排列） --- */
      .app {
        flex: 1 1 auto;
        width: 100%;
        max-width: 1800px;
        margin: 0 auto;
        padding: 0 20px calc(30px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      /* --- 弹性入场动画 --- */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* 给左右面板加交错入场效果 */
      .panel-settings {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
      }
      .panel-results {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.22s both;
      }

      /* --- 移动端分类标签布局：3列 --- */
      .category-group {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      /* --- 符号展示网格（自适应列宽） --- */
      .emoji-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
        gap: 10px;
        padding: 4px 0;
      }

      /* --- 符号列表滚动容器（移动端高度） --- */
      .emoji-container-scroll {
        max-height: 560px;
        overflow-y: auto;
        padding-right: 6px;
      }

      /* --- 数据看板统计行 --- */
      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
        color: var(--ink);
      }
      .stat-row .val {
        font-weight: 700;
        color: var(--accent);
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 16px;
      }

      /* --- 桌面端布局（≥860px） --- */
      @media (min-width: 860px) {
        .app {
          flex-direction: row;
          align-items: flex-start;
          padding-bottom: 45px;
        }
        .panel-settings {
          flex: 0 0 280px;
          display: flex;
          flex-direction: column;
          gap: 14px;
        }

        /* 分类卡片：固定整体高度 */
        .category-card {
          height: 400px;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }

        /* 滚动列表容器：由 Grid 改为 Flex 纵向排列 */
        .category-card .category-group {
          display: flex;
          flex-direction: column;
          flex: 1 1 auto;
          overflow-y: auto;
          gap: 8px;
          padding-right: 6px;
        }

        /* 修正按钮文字被挤压问题 */
        .category-card .cat-btn {
          flex: 0 0 auto; /* 关键：绝对禁止高度被压缩 */
          text-align: left;
          padding: 12px 16px;
          font-size: 14px;
          line-height: 1.4; /* 关键：明确行高 */
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .panel-results {
          flex: 1 1 auto;
          min-width: 0;
          display: flex;
          flex-direction: column;
        }
        .emoji-container-scroll {
          height: 550px;
          max-height: none;
        }
      }

      /* --- 卡片组件 --- */
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 8px 24px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }
      .panel-settings,
      .panel-results {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* --- 区块标题 --- */
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0 0 14px;
        flex: 0 0 auto;
      }

      /* --- 分类胶囊按钮（基础样式） --- */
      .cat-btn {
        width: 100%;
        text-align: center;
        padding: 10px 6px;
        border: 1px solid transparent;
        background: var(--bg);
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
        cursor: pointer;
        transition: all 0.15s ease;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cat-btn:hover {
        background: rgba(0, 0, 0, 0.03);
      }
      .cat-btn.active {
        background: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      /* --- 单个符号单元格样式 --- */
      .emoji-item {
        background: var(--bg);
        border-radius: var(--radius-sm);
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 500;
        cursor: pointer;
        transition:
          transform 0.1s ease,
          background-color 0.15s;
        user-select: none;
        border: 1px solid transparent;
      }
      .emoji-item:hover {
        background: rgba(0, 0, 0, 0.04);
        transform: scale(1.06);
      }
      .emoji-item:active {
        transform: scale(0.95);
        background: var(--line);
      }

      /* --- 滚动条优化 --- */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 3px;
      }

      /* --- Toast 轻提示 --- */
      .toast {
        position: fixed;
        top: max(18px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%) translateY(-12px);
        background: rgba(28, 28, 30, 0.92);
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        padding: 12px 22px;
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        z-index: 100;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <!-- --- Toast 提示容器 --- -->
    <div class="toast" id="toast">已复制到剪贴板</div>

    <!-- --- 顶部标题栏 --- -->
    <div class="topbar">
      <h1>🔣 特殊符号大全</h1>
      <p>纯本地分类快捷查阅 · 点击图标秒级复制</p>
    </div>

    <!-- --- 主应用区域（左右双栏） --- -->
    <div class="app">
      <!-- --- 左侧设置面板 --- -->

        </div>

        <!-- 分类卡片（添加 class="category-card" 以便桌面端固定高度滚动） -->

          <div class="category-group" id="categorySelector"></div>
        </div>
      </div>

          <div class="emoji-container-scroll">
            <div class="emoji-grid" id="emojiGrid"></div>
          </div>
        </div>
      </div>
    </div>

        /* --- 状态变量与 DOM 引用 --- */
        let activeIndex = 0;
        const categorySelector = document.getElementById("categorySelector");
        const emojiGrid = document.getElementById("emojiGrid");
        const gridTitle = document.getElementById("gridTitle");
        const totalCountVal = document.getElementById("totalCountVal");
        const toast = document.getElementById("toast");
        let toastTimer = null;

        /* --- Toast 轻提示逻辑 --- */
        function showToast(msg) {
          toast.textContent = msg;
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            toast.classList.remove("show");
          }, 1500);
        }

        /* --- 复制文本到剪贴板（兼容降级） --- */
        function copyToClipboard(text) {
          if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
          }
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          return Promise.resolve();
        }

        /* --- 计算总符号数并更新统计 --- */
        function calculateTotalSymbols() {
          const total = SYMBOL_DATA.reduce(
            (sum, category) => sum + category.symbols.length,
            0,
          );
          totalCountVal.textContent = `${total} 个`;
        }

        /* --- 渲染指定分类下的符号网格 --- */
        function renderSymbols(index) {
          const category = SYMBOL_DATA[index];
          gridTitle.textContent = `${category.name} (${category.symbols.length})`;

          emojiGrid.innerHTML = category.symbols
            .map(
              (sym) => `
      <div class="emoji-item" title="点击复制 ${sym}">${sym}</div>
    `,
            )
            .join("");

          // 绑定点击复制事件
          emojiGrid.querySelectorAll(".emoji-item").forEach((item) => {
            item.addEventListener("click", () => {
              const symStr = item.textContent;
              copyToClipboard(symStr).then(() => {
                showToast(`✅ 成功复制符号: ${symStr}`);
              });
            });
          });
        }

        /* --- 渲染分类按钮 --- */
        function renderCategories() {
          categorySelector.innerHTML = SYMBOL_DATA.map(
            (cat, idx) => `
      <button class="cat-btn${idx === activeIndex ? " active" : ""}" data-index="${idx}">${cat.name}</button>
    `,
          ).join("");

          categorySelector.querySelectorAll(".cat-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              const idx = parseInt(btn.dataset.index, 10);
              activeIndex = idx;

              categorySelector
                .querySelectorAll(".cat-btn")
                .forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");

              renderSymbols(activeIndex);
            });
          });
        }

        /* --- 初始化 --- */
        function init() {
          calculateTotalSymbols();
          renderCategories();
          renderSymbols(activeIndex);
        }

        init();
      })();

        function _isDarkMode() {
          var htmlTheme = document.documentElement.getAttribute("data-theme");
          var bodyTheme = document.body
            ? document.body.getAttribute("data-theme")
            : null;
          if (htmlTheme === "dark" || bodyTheme === "dark") return true;
          if (htmlTheme === "light" || bodyTheme === "light") return false;

          if (document.body && document.body.classList.contains("dark"))
            return true;

          try {
            var bg = getComputedStyle(document.documentElement)
              .getPropertyValue("--primary-bg")
              .trim();
            if (bg) {
              var hex = bg.replace("#", "");
              if (hex.length >= 2) {
                return parseInt(hex.substring(0, 2), 16) < 80;
              }
            }
          } catch (err) {}

          return (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          );
        }

            "}",
            "input,textarea{",
            "  user-select:text;",
            "  -webkit-user-select:text;",
            "}",
          ].join("\n");
          (document.head || document.documentElement).appendChild(style);
        })();

        document.addEventListener("copy", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
            if (e.clipboardData) e.clipboardData.setData("text/plain", "");
          }
        });

        document.addEventListener("cut", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
          }
        });

        document.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });

        document.addEventListener("keydown", function (e) {
          var k = e.key ? e.key.toLowerCase() : "";

          if (e.key === "F12") {
            e.preventDefault();
            return false;
          }

          if (e.ctrlKey && !e.shiftKey && ["u", "s", "p"].includes(k)) {
            e.preventDefault();
            return false;
          }

          if (e.ctrlKey && e.shiftKey && ["i", "j", "c"].includes(k)) {
            e.preventDefault();
            return false;
          }

          var isPrtSc = e.key === "PrintScreen";
          var isMacShot =
            e.metaKey && e.shiftKey && ["3", "4", "5", "6"].includes(e.key);
          var isWinShot = e.key === "PrintScreen" && (e.metaKey || e.altKey);
          if (isPrtSc || isMacShot || isWinShot) {
            _showCaptureOverlay();
            e.preventDefault();
            setTimeout(_hideCaptureOverlay, 400);
          }

          if (
            (e.ctrlKey || e.metaKey) &&
            ["+", "-", "=", "0"].includes(e.key)
          ) {
            e.preventDefault();
            return false;
          }
        });

        var _devToolsBlocked = false;

        function _checkDevTools() {
          var wGap = window.outerWidth - window.innerWidth;
          var hGap = window.outerHeight - window.innerHeight;
          if ((wGap > 160 || hGap > 160) && !_devToolsBlocked) {
            _devToolsBlocked = true;
            var isDark = _isDarkMode();
            var bg = isDark ? "#000000" : "#F2F2F7";
            var fg = isDark ? "#EBEBF5" : "#3C3C43";
            document.body.innerHTML =
              '<div style="display:flex;align-items:center;justify-content:center;' +
              "height:100vh;background:" +
              bg +
              ';font-family:-apple-system,sans-serif;">' +
              '<p style="font-size:18px;color:' +
              fg +
              ';text-align:center;">' +
              "⚠️ 页面加载异常，请刷新后重试</p></div>";
          }
        }

        setInterval(_checkDevTools, 1000);

        var _overlay = null;

        function _showCaptureOverlay() {
          if (_overlay) return;
          _overlay = document.createElement("div");
          _overlay.style.cssText = [
            "position:fixed",
            "inset:0",
            "z-index:2147483647",
            "background:#000",
            "opacity:0",
            "transition:opacity .1s ease",
            "pointer-events:none",
            "will-change:opacity",
          ].join(";");
          document.body.appendChild(_overlay);
          requestAnimationFrame(function () {
            _overlay.style.opacity = "1";
          });
        }

        function _hideCaptureOverlay() {
          if (!_overlay) return;
          _overlay.style.opacity = "0";
          var o = _overlay;
          setTimeout(function () {
            if (o && o.parentNode) o.parentNode.removeChild(o);
            if (_overlay === o) _overlay = null;
          }, 150);
        }

        var _trap = /./;
        _trap.toString = function () {
          return "⚠️ 禁止调试";
        };
        setInterval(function () {
          console.log("%c", _trap);
        }, 2000);

        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );

        document.addEventListener(
          "gesturestart",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gesturechange",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gestureend",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );

        window.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>
  </body>
</html>
