<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>JSON 格式化</title>
    <meta
      name="description"
      content="JSON 格式化 - 纯本地离线工具，粘贴或导入 .json 文件即可一键美化排版，实时显示字符与行数统计，支持复制结果或下载为格式化后的 JSON 文件，错误提示清晰，隐私安全。"
    />
    <link
      rel="apple-touch-icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/logo.svg"
    />
    <link
      rel="icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/logo.svg"
      type="image/svg+xml"
    />
    <style>
      /* ── 设计令牌 ── */
      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --ink: #1d1d1f;
        --sub: #86868b;
        --accent: #0071e3;
        --accent-press: #0059b3;
        --line: rgba(0, 0, 0, 0.08);
        --red: #ff3b30;
        --radius: 18px;
        --radius-sm: 12px;
      }

      /* ── 基础重置 ── */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ── 顶栏 ── */
      .topbar {
        text-align: center;
        padding: max(28px, env(safe-area-inset-top)) 0 18px;
        flex: 0 0 auto;
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .topbar h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .topbar p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--sub);
      }

      /* ── 主容器与入场动画 ── */
      .app {
        flex: 1 1 auto;
        width: 100%;
        max-width: 1800px;
        margin: 0 auto;
        padding: 0 12px calc(30px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .panel-left {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
      }
      .panel-right {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.22s both;
      }

      /* ── 卡片与面板 ── */
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 8px 24px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }
      .panel-left,
      .panel-right {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* ── 区块标题 ── */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0;
        flex: 1;
      }
      .meta-info {
        font-size: 12px;
        color: var(--sub);
        font-family: ui-monospace, SFMono-Regular, monospace;
      }

      /* ── 输入输出文本框 ── */
      textarea {
        width: 100%;
        flex: 1;
        min-height: 550px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 15px;
        line-height: 1.5;
        color: var(--ink);
        resize: none;
        outline: none;
        transition: border-color 0.2s;
      }
      textarea:focus {
        border-color: var(--accent);
      }
      textarea::placeholder {
        color: var(--sub);
        opacity: 0.6;
      }

      /* ── 按钮 ── */
      .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .btn {
        flex: 1;
        min-width: 100px;
        border: none;
        border-radius: 14px;
        padding: 13px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          background-color 0.15s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:active {
        background: var(--accent-press);
      }
      .btn-secondary {
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn-secondary:hover {
        background: rgba(0, 0, 0, 0.02);
      }
      .btn-danger {
        background: var(--bg);
        color: var(--red);
        border: 1px solid var(--line);
      }

      /* ── 隐藏文件输入 ── */
      #fileInput {
        display: none;
      }

      /* ── 滚动条 ── */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 3px;
      }

      /* ── Toast ── */
      .toast {
        position: fixed;
        top: max(18px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%) translateY(-12px);
        background: rgba(28, 28, 30, 0.92);
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        padding: 12px 22px;
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        z-index: 100;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ── 桌面端双栏 ── */
      @media (min-width: 860px) {
        .app {
          flex-direction: row;
          align-items: stretch;
          padding-bottom: 45px;
        }
        .panel-left,
        .panel-right {
          flex: 1 1 50%;
          min-width: 0;
        }
      }

      /* ── 减少动效 ── */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="toast" id="toast">已复制到剪贴板</div>

    <div class="topbar">
      <h1>📦 JSON 格式化</h1>
      <p>本地安全处理 · 不会上传任何数据</p>
    </div>

    <div class="app">
      <div class="panel-left">
        <div class="card">
          <div class="section-header">
            <p class="section-title">输入原始 JSON</p>
            <span class="meta-info" id="inputMeta">0 字符 / 0 行</span>
          </div>
          <textarea
            id="jsonInput"
            placeholder="在此粘贴 JSON 字符串，或直接拖拽 .json 文件到这里..."
            spellcheck="false"
          ></textarea>

          <div class="btn-row">
            <input type="file" id="fileInput" accept=".json,application/json" />
            <button class="btn btn-secondary" id="importBtn">导入文件</button>
            <button class="btn btn-danger" id="clearBtn">清空</button>
            <button class="btn btn-primary" id="formatBtn">美化排版</button>
          </div>
        </div>
      </div>

      <div class="panel-right">
        <div class="card">
          <div class="section-header">
            <p class="section-title">处理结果</p>
            <span class="meta-info" id="outputMeta">0 字符 / 0 行</span>
          </div>
          <textarea
            id="jsonOutput"
            placeholder="排版后的结果将显示在这里..."
            readonly
            spellcheck="false"
          ></textarea>

          <div class="btn-row">
            <button class="btn btn-secondary" id="downloadBtn">下载文件</button>
            <button class="btn btn-primary" id="copyBtn">复制结果</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ── 关闭历史滚动恢复 ──
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }

      (function () {
        // ── DOM 引用 ──
        const jsonInput = document.getElementById("jsonInput");
        const jsonOutput = document.getElementById("jsonOutput");
        const inputMeta = document.getElementById("inputMeta");
        const outputMeta = document.getElementById("outputMeta");

        const fileInput = document.getElementById("fileInput");
        const importBtn = document.getElementById("importBtn");
        const clearBtn = document.getElementById("clearBtn");
        const formatBtn = document.getElementById("formatBtn");

        const downloadBtn = document.getElementById("downloadBtn");
        const copyBtn = document.getElementById("copyBtn");
        const toast = document.getElementById("toast");

        // ── 通用提示 ──
        let toastTimer = null;
        function showToast(msg) {
          toast.textContent = msg || "已复制到剪贴板";
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            toast.classList.remove("show");
          }, 1600);
        }

        // ── 字符 / 行数统计 ──
        function updateMeta(textarea, metaEl) {
          const text = textarea.value;
          if (!text) {
            metaEl.textContent = "0 字符 / 0 行";
            return;
          }
          metaEl.textContent = `${text.length} 字符 / ${text.split("\n").length} 行`;
        }

        // ── JSON 解析与格式化 ──
        function processJSON() {
          const rawValue = jsonInput.value.trim();
          if (!rawValue) {
            showToast("请输入或导入 JSON 内容");
            return false;
          }
          try {
            const parsed = JSON.parse(rawValue);
            jsonOutput.value = JSON.stringify(parsed, null, 2);
            updateMeta(jsonOutput, outputMeta);
            return true;
          } catch (e) {
            showToast("JSON 格式错误，请检查！");
            jsonOutput.value = `错误信息:\n${e.message}`;
            updateMeta(jsonOutput, outputMeta);
            return false;
          }
        }

        // ── 复制（含降级方案） ──
        function copyText(text) {
          if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
          }
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          return Promise.resolve();
        }

        // ── 文件读取 ──
        function handleFile(file) {
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function (e) {
            jsonInput.value = e.target.result;
            updateMeta(jsonInput, inputMeta);
            showToast("文件导入成功，请点击美化排版");
          };
          reader.readAsText(file);
        }

        // ── 事件绑定：输入与导入 ──
        jsonInput.addEventListener("input", () =>
          updateMeta(jsonInput, inputMeta),
        );

        importBtn.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", (e) =>
          handleFile(e.target.files[0]),
        );

        jsonInput.addEventListener("dragover", (e) => {
          e.preventDefault();
        });
        jsonInput.addEventListener("drop", (e) => {
          e.preventDefault();
          if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]);
          }
        });

        clearBtn.addEventListener("click", () => {
          jsonInput.value = "";
          jsonOutput.value = "";
          fileInput.value = "";
          updateMeta(jsonInput, inputMeta);
          updateMeta(jsonOutput, outputMeta);
          showToast("已清空");
        });

        formatBtn.addEventListener("click", () => {
          if (processJSON()) showToast("美化排版成功");
        });

        // ── 复制结果 ──
        copyBtn.addEventListener("click", () => {
          const outputVal = jsonOutput.value;
          if (!outputVal || outputVal.startsWith("错误信息:")) {
            showToast("没有可复制的有效结果");
            return;
          }
          copyText(outputVal).then(() => showToast("结果已复制到剪贴板"));
        });

        // ── 下载为 .json ──
        downloadBtn.addEventListener("click", () => {
          const outputVal = jsonOutput.value;
          if (!outputVal || outputVal.startsWith("错误信息:")) {
            showToast("没有可下载的有效结果");
            return;
          }
          const blob = new Blob([outputVal], {
            type: "application/json;charset=utf-8;",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `formatted_${Date.now()}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast("文件已开始下载");
        });
      })();
    </script>

    <script>
      (function () {
        "use strict";

        function _isDarkMode() {
          var htmlTheme = document.documentElement.getAttribute("data-theme");
          var bodyTheme = document.body
            ? document.body.getAttribute("data-theme")
            : null;
          if (htmlTheme === "dark" || bodyTheme === "dark") return true;
          if (htmlTheme === "light" || bodyTheme === "light") return false;
          if (document.body && document.body.classList.contains("dark"))
            return true;
          try {
            var bg = getComputedStyle(document.documentElement)
              .getPropertyValue("--primary-bg")
              .trim();
            if (bg) {
              var hex = bg.replace("#", "");
              if (hex.length >= 2) {
                return parseInt(hex.substring(0, 2), 16) < 80;
              }
            }
          } catch (err) {}
          return (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          );
        }

        (function _injectUserSelectCSS() {
          var style = document.createElement("style");
          style.id = "security-user-select";
          style.textContent = [
            "body{",
            "  user-select:none;",
            "  -webkit-user-select:none;",
            "  -moz-user-select:none;",
            "  -ms-user-select:none;",
            "}",
            "input,textarea{",
            "  user-select:text;",
            "  -webkit-user-select:text;",
            "}",
          ].join("\n");
          (document.head || document.documentElement).appendChild(style);
        })();

        document.addEventListener("copy", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
            if (e.clipboardData) e.clipboardData.setData("text/plain", "");
          }
        });

        document.addEventListener("cut", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
          }
        });

        document.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });

        document.addEventListener("keydown", function (e) {
          var key = (e.key || "").toLowerCase();

          if (e.ctrlKey || e.metaKey) {
            if (key === "s") {
              e.preventDefault();
              return false;
            }

            if (["+", "-", "=", "0"].includes(e.key)) {
              e.preventDefault();
              return false;
            }
          }
        });

        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );

        document.addEventListener(
          "gesturestart",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gesturechange",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gestureend",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );

        window.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>
  </body>
</html>
