<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>每日一言</title>
    <meta
      name="description"
      content="每日一言 - 纯本地离线工具，内置动漫/文学/影视等分类名言库，随机获取佳句并配精美图片，支持一键复制文本与语音朗读，无需联网，隐私无忧，每日品味智慧。"
    />
    <link
      rel="apple-touch-icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/logo.svg"
    />
    <link
      rel="icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/logo.svg"
      type="image/svg+xml"
    />
    <style>
      /* ── 设计令牌 ── */
      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --ink: #1d1d1f;
        --sub: #86868b;
        --accent: #0071e3;
        --accent-press: #0059b3;
        --line: rgba(0, 0, 0, 0.08);
        --green: #34c759;
        --radius: 18px;
        --radius-sm: 12px;
      }

      /* ── 基础重置 ── */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        scrollbar-gutter: stable;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ── 顶栏 ── */
      .topbar {
        text-align: center;
        padding: max(28px, env(safe-area-inset-top)) 0 18px;
        flex: 0 0 auto;
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .topbar h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .topbar p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--sub);
      }

      /* ── 主容器与入场动画 ── */
      .app {
        flex: 1 1 auto;
        width: 100%;
        max-width: 1800px;
        margin: 0 auto;
        padding: 0 12px calc(30px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .panel-settings {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
      }
      .panel-results {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.22s both;
      }

      /* ── 卡片与面板 ── */
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 8px 24px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }
      .panel-settings,
      .panel-results {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* ── 区块标题 ── */
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0 0 14px;
      }

      /* ── 分类按钮（移动端 3 列网格） ── */
      .category-group {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .cat-btn {
        width: 100%;
        text-align: center;
        padding: 10px 6px;
        border: 1px solid transparent;
        background: var(--bg);
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
        cursor: pointer;
        transition: all 0.15s ease;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cat-btn:hover {
        background: rgba(0, 0, 0, 0.03);
      }
      .cat-btn.active {
        background: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      /* ── 桌面端顶部胶囊分类条（默认隐藏） ── */
      .category-bar {
        display: none;
        flex-wrap: nowrap;
        gap: 8px;
        overflow-x: auto;
        margin: 0 0 16px;
        padding-bottom: 2px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .category-bar::-webkit-scrollbar {
        display: none;
      }
      .category-bar .cat-btn {
        flex: 0 0 auto;
        width: auto;
        padding: 8px 18px;
        border-radius: 999px;
        font-size: 13px;
      }

      /* ── 一言展示核心 ── */
      .quote-display {
        display: flex;
        flex-direction: column;
        min-height: 280px;
        justify-content: center;
      }
      .quote-tag {
        align-self: flex-start;
        background: rgba(0, 113, 227, 0.1);
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 6px;
        margin-bottom: 16px;
        letter-spacing: 0.04em;
      }

      /* ── 配图容器 ── */
      .quote-image-wrap {
        width: 100%;
        border-radius: var(--radius-sm);
        overflow: hidden;
        margin-bottom: 20px;
        position: relative;
        background: var(--bg);
        border: 1px solid var(--line);
      }
      .quote-image {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
        transition: opacity 0.3s ease;
      }
      .img-loading-mask {
        position: absolute;
        inset: 0;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: var(--sub);
        transition: opacity 0.3s;
      }
      .img-refresh-btn {
        position: absolute;
        bottom: 12px;
        right: 12px;
        background: rgba(255, 255, 255, 0.9);
        border: none;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        font-size: 15px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.2s ease,
          background-color 0.2s;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      .img-refresh-btn:active {
        transform: scale(0.92) rotate(45deg);
        background: #fff;
      }

      /* ── 句子主体 ── */
      .quote-text {
        font-size: 19px;
        font-weight: 600;
        line-height: 1.6;
        color: var(--ink);
        margin: 10px 0 14px;
        word-break: break-all;
      }
      .quote-author {
        font-size: 14px;
        color: var(--sub);
        font-weight: 500;
        margin-bottom: 20px;
        text-align: right;
      }

      /* ── 加载骨架屏 ── */
      .quote-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 0;
        gap: 12px;
        color: var(--sub);
        font-size: 14px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── 按钮 ── */
      .btn-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 14px;
      }
      .btn-sub-pair {
        display: flex;
        gap: 10px;
        width: 100%;
      }
      .btn {
        border: none;
        border-radius: 14px;
        padding: 13px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          background-color 0.15s ease,
          color 0.15s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn:active {
        transform: scale(0.97);
      }
      #copyBtn,
      #speakBtn {
        flex: 1;
        min-width: 0;
      }
      #randomBtn {
        width: 100%;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:active {
        background: var(--accent-press);
      }
      .btn-secondary {
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn-secondary:hover {
        background: rgba(0, 0, 0, 0.02);
      }
      .btn-speaking,
      .btn-speaking:hover,
      .btn-speaking:active {
        background: var(--green);
        color: #fff;
      }

      /* ── 滚动条 ── */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 3px;
      }

      /* ── Toast ── */
      .toast {
        position: fixed;
        top: max(18px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%) translateY(-12px);
        background: rgba(28, 28, 30, 0.92);
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        padding: 12px 22px;
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        z-index: 100;
        max-width: calc(100vw - 40px);
        text-align: center;
        word-break: break-word;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ── 桌面端双栏 ── */
      @media (min-width: 860px) {
        .app {
          flex-direction: row;
          align-items: stretch;
          padding-bottom: 45px;
        }
        .panel-settings {
          display: none;
        }
        .category-bar {
          display: flex;
        }
        .panel-results {
          flex: 1 1 auto;
          min-width: 0;
          align-self: flex-start;
        }
        .panel-results > .card {
          flex: 1;
          min-height: 0;
        }
        .quote-display {
          flex: 1;
          min-height: 560px;
        }
        .quote-image-wrap {
          flex: 1 1 auto;
          min-height: 160px;
          max-height: 560px;
        }
        .quote-image {
          height: 100%;
        }
        .quote-tag,
        .quote-text,
        .quote-author {
          flex-shrink: 0;
        }
        .btn-row {
          flex-direction: row;
          flex-wrap: wrap;
        }
        .btn-sub-pair {
          display: contents;
        }
        .btn {
          flex: 1;
          min-width: 100px;
        }
        #randomBtn {
          width: auto;
        }
      }

      /* ── 减少动效 ── */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="topbar">
      <h1>📖 每日一言</h1>
      <p>随机佳句 · 语音朗读 · 本地安全品味</p>
    </div>

    <div class="app">
      <div class="panel-settings">
        <div class="card">
          <p class="section-title">佳句分类</p>
          <div class="category-group" id="categorySelector"></div>
        </div>
      </div>

      <div class="panel-results">
        <div class="card">
          <p class="section-title">一言空间</p>

          <div class="category-bar" id="categoryBar"></div>

          <div class="quote-display" id="quoteDisplay">
            <div class="quote-loading">
              <div class="spinner"></div>
              <span>正在寻找佳句…</span>
            </div>
          </div>
          <div class="btn-row">
            <div class="btn-sub-pair">
              <button class="btn btn-secondary" id="copyBtn">
                📋 复制文本
              </button>
              <button class="btn btn-secondary" id="speakBtn">
                🔊 语音朗读
              </button>
            </div>
            <button class="btn btn-primary" id="randomBtn">
              🎲 随机下一句
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ── 关闭历史滚动恢复 ──
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";

      (function () {
        "use strict";

        // ── 分类配置 ──
        const CATEGORIES = [
          { code: "a", name: "动漫次元" },
          { code: "b", name: "文学经典" },
          { code: "c", name: "影视荧幕" },
          { code: "d", name: "古风诗词" },
          { code: "e", name: "原创情感" },
          { code: "f", name: "名人哲思" },
          { code: "i", name: "逆风励志" },
          { code: "j", name: "网易云乐评" },
        ];

        // ── API 数据源 ──
        const API_SOURCES = [
          {
            name: "hitokoto",
            url: (cat) => `https://v1.hitokoto.cn/${cat ? "?c=" + cat : ""}`,
            parse: (d) => ({
              text: d.hitokoto,
              author: d.from_who || d.from || "佚名",
              source: d.from || "",
              type: d.type,
            }),
          },
          {
            name: "gushi",
            url: () => "https://api.gushi.ci/all.json",
            parse: (d) => ({
              text: d.content,
              author: (d.origin && d.origin.author) || "佚名",
              source: (d.origin && d.origin.title) || "",
              type: "d",
            }),
          },
          {
            name: "btstu",
            url: () =>
              "https://api.btstu.cn/yan/api.php?charset=utf-8&encode=json",
            parse: (d) => ({
              text: d.text || d.content,
              author: d.source || "格言网",
              source: "",
              type: "f",
            }),
          },
          {
            name: "yiyan_v2",
            url: () => "https://yiyan.us.kg/",
            parse: (d) => ({
              text: d.hitokoto,
              author: d.from_who || d.from || "佚名",
              source: d.from || "",
              type: d.type,
            }),
          },
        ];

        // ── 配图素材池 ──
        const IMAGE_POOL = [
          10, 15, 20, 25, 27, 29, 36, 39, 42, 43, 48, 57, 64, 65, 67, 73, 74,
          82, 83, 84, 85, 87, 91, 93, 94, 99, 100, 106, 110, 112, 116, 119, 120,
          127, 130, 137, 139, 143, 145, 147, 152, 155, 160, 166, 168, 172, 175,
          181, 190, 193, 196, 200, 201, 202, 203, 204, 205, 210, 214, 217, 219,
          220, 222, 225, 228, 229, 230, 232, 237, 239, 244, 247, 250, 256, 257,
          260, 266, 267, 271, 274, 277, 280, 284, 287, 290, 292, 293, 295, 299,
          301, 303, 306, 308, 311, 312, 315, 316, 317, 318, 319, 320, 321,
        ].map((id) => `https://picsum.photos/id/${id}/700/350`);

        // ── 本地备用名言库 ──
        const LOCAL_QUOTES = [
          {
            text: "生命中最困难的阶段不是没有人懂你，而是你不懂自己。",
            author: "尼采",
            source: "《悲剧的诞生》",
            type: "f",
          },
          {
            text: "如果你长时间凝视深渊，深渊也会凝视你。",
            author: "尼采",
            source: "《善恶的彼岸》",
            type: "f",
          },
          {
            text: "我慢慢明白了为什么我不快乐，因为我总是期待一个结果。",
            author: "村上春树",
            source: "《挪威的森林》",
            type: "b",
          },
          {
            text: "不管全世界所有人怎么说，我都认为自己的感受才是正确的。",
            author: "宫崎骏",
            source: "《龙猫》",
            type: "a",
          },
          {
            text: "世界上只有一种真正的英雄主义，就是认清生活的真相后依然热爱生活。",
            author: "罗曼·罗兰",
            source: "《约翰·克里斯朵夫》",
            type: "f",
          },
          {
            text: "生如夏花之绚烂，死如秋叶之静美。",
            author: "泰戈尔",
            source: "《飞鸟集》",
            type: "b",
          },
          {
            text: "每一个不曾起舞的日子，都是对生命的辜负。",
            author: "尼采",
            source: "",
            type: "i",
          },
          {
            text: "千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。",
            author: "柳宗元",
            source: "《江雪》",
            type: "d",
          },
          {
            text: "此情可待成追忆，只是当时已惘然。",
            author: "李商隐",
            source: "《锦瑟》",
            type: "d",
          },
          {
            text: "人生若只如初见，何事秋风悲画扇。",
            author: "纳兰性德",
            source: "《木兰词》",
            type: "d",
          },
          {
            text: "你的时间有限，所以不要浪费时间去过别人的生活。",
            author: "乔布斯",
            source: "",
            type: "i",
          },
        ];

        // ── DOM 引用 ──
        const toastEl = document.getElementById("toast");
        const quoteDisplay = document.getElementById("quoteDisplay");
        const categorySelector = document.getElementById("categorySelector");
        const categoryBar = document.getElementById("categoryBar");
        const copyBtn = document.getElementById("copyBtn");
        const speakBtn = document.getElementById("speakBtn");
        const randomBtn = document.getElementById("randomBtn");

        // ── 状态 ──
        let currentQuote = null;
        let currentCategory = CATEGORIES[0].code;
        let isSpeaking = false;
        let usedImgIndices = [];

        // ── 提示条 ──
        let toastTimer = null;
        function showToast(msg) {
          toastEl.textContent = msg || "操作成功";
          toastEl.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
        }

        // ── 分类中文名 ──
        function getCatName(type) {
          const map = {
            a: "动漫",
            b: "文学",
            c: "影视",
            d: "诗词",
            e: "原创",
            f: "经典",
            i: "励志",
            j: "网易云",
          };
          return map[type] || "佳句";
        }

        // ── 随机取图（避免连续重复） ──
        function getRandomImage() {
          if (usedImgIndices.length >= IMAGE_POOL.length) usedImgIndices = [];
          let idx;
          do {
            idx = Math.floor(Math.random() * IMAGE_POOL.length);
          } while (usedImgIndices.includes(idx));
          usedImgIndices.push(idx);
          return IMAGE_POOL[idx];
        }

        // ── 渲染名言与配图 ──
        function renderQuote(quote, imgUrl) {
          const authorLine = quote.author ? `—— ${quote.author}` : "";
          const sourceLine = quote.source ? ` 《${quote.source}》` : "";

          quoteDisplay.innerHTML = `
            <div class="quote-tag">${getCatName(quote.type)}</div>
            <div class="quote-image-wrap">
              <img class="quote-image" src="${imgUrl}" alt="配图">
              <button class="img-refresh-btn" id="imgRefreshBtn" title="更换配图">🔄</button>
              <div class="img-loading-mask" id="imgMask">配图精心加载中…</div>
            </div>
            <div class="quote-text">“ ${quote.text} ”</div>
            <div class="quote-author">${authorLine}${sourceLine}</div>
          `;

          const img = quoteDisplay.querySelector(".quote-image");
          const mask = document.getElementById("imgMask");
          img.addEventListener("load", () => {
            mask.style.opacity = "0";
            setTimeout(() => (mask.style.display = "none"), 300);
          });
          if (img.complete) mask.style.display = "none";

          document
            .getElementById("imgRefreshBtn")
            .addEventListener("click", () => {
              mask.style.display = "flex";
              mask.style.opacity = "1";
              img.src = getRandomImage();
              showToast("已无缝更换壁纸 🖼️");
            });
        }

        // ── 加载状态切换 ──
        function setLoading(on) {
          if (on) {
            randomBtn.disabled = true;
            randomBtn.textContent = "⏳ 加载中…";
            quoteDisplay.innerHTML = `
              <div class="quote-loading">
                <div class="spinner"></div>
                <span>正在寻觅远方的灵感佳句…</span>
              </div>`;
          } else {
            randomBtn.disabled = false;
            randomBtn.textContent = "🎲 随机下一句";
          }
        }

        // ── 单一源请求 ──
        async function tryFetchFromSource(src, cat) {
          const resp = await fetch(src.url(cat), {
            signal: AbortSignal.timeout(4000),
          });
          if (!resp.ok) throw new Error("non-200");
          const data = await resp.json();
          const parsed = src.parse(data);
          if (!parsed || !parsed.text) throw new Error("empty");
          return parsed;
        }

        // ── 获取名言：API 优先，本地兜底 ──
        async function fetchQuote() {
          for (const src of API_SOURCES) {
            try {
              return await tryFetchFromSource(src, currentCategory);
            } catch {}
          }
          const pool = currentCategory
            ? LOCAL_QUOTES.filter((q) => q.type === currentCategory)
            : LOCAL_QUOTES;
          const candidates = pool.length ? pool : LOCAL_QUOTES;
          return candidates[Math.floor(Math.random() * candidates.length)];
        }

        // ── 获取新名言并刷新界面 ──
        async function getNewQuote() {
          setLoading(true);
          if (isSpeaking) toggleSpeak();
          try {
            const quote = await fetchQuote();
            currentQuote = quote;
            renderQuote(quote, getRandomImage());
          } catch {
            const q =
              LOCAL_QUOTES[Math.floor(Math.random() * LOCAL_QUOTES.length)];
            currentQuote = q;
            renderQuote(q, getRandomImage());
            showToast("网络微调，已启用本地名言保护机制");
          }
          setLoading(false);
        }

        // ── 语音朗读 ──
        function toggleSpeak() {
          if (isSpeaking) {
            window.speechSynthesis.cancel();
            isSpeaking = false;
            speakBtn.classList.remove("btn-speaking");
            speakBtn.textContent = "🔊 语音朗读";
            return;
          }
          if (!currentQuote) return;
          const utter = new SpeechSynthesisUtterance(currentQuote.text);
          utter.lang = "zh-CN";
          utter.rate = 0.95;
          utter.onend = () => {
            isSpeaking = false;
            speakBtn.classList.remove("btn-speaking");
            speakBtn.textContent = "🔊 语音朗读";
          };
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(utter);
          isSpeaking = true;
          speakBtn.classList.add("btn-speaking");
          speakBtn.textContent = "⏹️ 停止朗读";
        }

        // ── 复制名言 ──
        function copyQuote() {
          if (!currentQuote) return;
          const authorPart = currentQuote.author
            ? ` — ${currentQuote.author}`
            : "";
          const srcPart = currentQuote.source
            ? `《${currentQuote.source}》`
            : "";
          const text = `“${currentQuote.text}”${authorPart}${srcPart}`;

          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard
              .writeText(text)
              .then(() => showToast("已成功复制到剪贴板"));
          } else {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            showToast("已成功复制到剪贴板");
          }
        }

        // ── 同步两侧按钮激活态 ──
        function syncActive() {
          document.querySelectorAll(".cat-btn").forEach((btn) => {
            btn.classList.toggle(
              "active",
              (btn.dataset.code || "") === currentCategory,
            );
          });
        }

        // ── 渲染分类选择器 ──
        function renderCategories() {
          const html = CATEGORIES.map(
            (cat) =>
              `<button class="cat-btn" data-code="${cat.code}">${cat.name}</button>`,
          ).join("");

          categorySelector.innerHTML = html;
          categoryBar.innerHTML = html;

          document.querySelectorAll(".cat-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              currentCategory = btn.dataset.code || "";
              syncActive();
              getNewQuote();
            });
          });

          syncActive();
        }

        // ── 初始化 ──
        renderCategories();
        randomBtn.addEventListener("click", getNewQuote);
        copyBtn.addEventListener("click", copyQuote);
        speakBtn.addEventListener("click", toggleSpeak);
        getNewQuote();
      })();
    </script>

    <script>
      (function () {
        "use strict";

        function _isDarkMode() {
          var htmlTheme = document.documentElement.getAttribute("data-theme");
          var bodyTheme = document.body
            ? document.body.getAttribute("data-theme")
            : null;
          if (htmlTheme === "dark" || bodyTheme === "dark") return true;
          if (htmlTheme === "light" || bodyTheme === "light") return false;
          if (document.body && document.body.classList.contains("dark"))
            return true;
          try {
            var bg = getComputedStyle(document.documentElement)
              .getPropertyValue("--primary-bg")
              .trim();
            if (bg) {
              var hex = bg.replace("#", "");
              if (hex.length >= 2) {
                return parseInt(hex.substring(0, 2), 16) < 80;
              }
            }
          } catch (err) {}
          return (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          );
        }

        (function _injectUserSelectCSS() {
          var style = document.createElement("style");
          style.id = "security-user-select";
          style.textContent = [
            "body{",
            "  user-select:none;",
            "  -webkit-user-select:none;",
            "  -moz-user-select:none;",
            "  -ms-user-select:none;",
            "}",
            "input,textarea{",
            "  user-select:text;",
            "  -webkit-user-select:text;",
            "}",
          ].join("\n");
          (document.head || document.documentElement).appendChild(style);
        })();

        document.addEventListener("copy", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
            if (e.clipboardData) e.clipboardData.setData("text/plain", "");
          }
        });

        document.addEventListener("cut", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
          }
        });

        document.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });

        document.addEventListener("keydown", function (e) {
          var key = (e.key || "").toLowerCase();

          if (e.ctrlKey || e.metaKey) {
            if (key === "s") {
              e.preventDefault();
              return false;
            }

            if (["+", "-", "=", "0"].includes(e.key)) {
              e.preventDefault();
              return false;
            }
          }
        });

        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );

        document.addEventListener(
          "gesturestart",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gesturechange",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gestureend",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );

        window.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>
  </body>
</html>
