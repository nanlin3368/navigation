<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>反应速度测试</title>
    <meta
      name="description"
      content="反应速度测试 - 纯本地离线工具，通过随机延迟变绿触发，高精度捕获毫秒级反应时间，实时统计平均/最佳/最差成绩，追踪历史记录，评估神经反射速度。"
    />
    <link
      rel="apple-touch-icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/logo.svg"
    />
    <link
      rel="icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/logo.svg"
      type="image/svg+xml"
    />
    <style>
      /* ── 设计令牌 ── */
      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --ink: #1d1d1f;
        --sub: #86868b;
        --accent: #0071e3;
        --accent-press: #0059b3;
        --line: rgba(0, 0, 0, 0.08);
        --red: #ff3b30;
        --green: #34c759;
        --radius: 18px;
        --radius-sm: 12px;
      }

      /* ── 基础重置 ── */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ── 顶栏 ── */
      .topbar {
        text-align: center;
        padding: max(28px, env(safe-area-inset-top)) 0 18px;
        flex: 0 0 auto;
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .topbar h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .topbar p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--sub);
      }

      /* ── 主容器与入场动画 ── */
      .app {
        flex: 1 1 auto;
        width: 100%;
        max-width: 1800px;
        margin: 0 auto;
        padding: 0 12px calc(30px + env(safe-area-inset-bottom, 0px));
        display: flex;
        gap: 18px;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .panel-left {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
      }
      .panel-right {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.22s both;
      }

      /* ── 卡片与面板 ── */
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 8px 24px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }
      .panel-right .card {
        flex: 1;
      }

      /* ── 区块标题 ── */
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0 0 12px 0;
      }

      /* ── 统计面板 ── */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .stat-box {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 12px 8px;
        text-align: center;
      }
      .stat-label {
        font-size: 12px;
        color: var(--sub);
        margin-bottom: 4px;
      }
      .stat-val {
        font-size: 16px;
        font-weight: 700;
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, monospace;
      }

      /* ── 历史记录 ── */
      .history-list {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        max-height: 190px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      .history-item {
        display: flex;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .history-item:last-child {
        border-bottom: none;
      }
      .history-index {
        color: var(--sub);
        font-weight: 500;
      }
      .history-time {
        margin-left: auto;
        font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, monospace;
      }

      /* ── 测试交互区（状态驱动） ── */
      .test-zone {
        width: 100%;
        flex: 1;
        min-height: 550px;
        border-radius: var(--radius-sm);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
        transition: background-color 0.15s ease;
        text-align: center;
        padding: 24px;
      }
      .state-ready {
        background: #e8e8ed;
        color: var(--ink);
        border: 1px dashed rgba(0, 0, 0, 0.15);
      }
      .state-ready:hover {
        background: #dfdfe5;
      }
      .state-waiting {
        background: var(--red);
        color: #ffffff;
      }
      .state-now {
        background: var(--green);
        color: #ffffff;
      }
      .test-icon {
        font-size: 42px;
        margin-bottom: 12px;
      }
      .test-main-text {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 6px;
      }
      .test-sub-text {
        font-size: 14px;
        opacity: 0.75;
      }

      /* ── 按钮 ── */
      .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 2px;
      }
      .btn {
        flex: 1;
        border: none;
        border-radius: 14px;
        padding: 13px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          background-color 0.15s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:active {
        background: var(--accent-press);
      }
      .btn-danger {
        background: var(--bg);
        color: var(--red);
        border: 1px solid var(--line);
      }
      .btn-danger:hover {
        background: rgba(255, 59, 48, 0.05);
      }

      /* ── 滚动条 ── */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.12);
        border-radius: 3px;
      }

      /* ── Toast ── */
      .toast {
        position: fixed;
        top: max(18px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%) translateY(-12px);
        background: rgba(28, 28, 30, 0.92);
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        padding: 12px 22px;
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        z-index: 100;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ── 桌面端布局 ── */
      @media (min-width: 860px) {
        .app {
          flex-direction: row;
          align-items: stretch;
          padding-bottom: 45px;
        }
        .panel-left {
          flex: 0 0 400px;
          display: flex;
          flex-direction: column;
          gap: 14px;
        }
        .panel-right {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-self: flex-start;
        }
      }

      /* ── 移动端重排 ── */
      @media (max-width: 860px) {
        .app {
          flex-direction: column;
        }
        .panel-left {
          display: flex;
          flex-direction: column;
          gap: 14px;
          order: 2;
        }
        .panel-right {
          display: flex;
          flex-direction: column;
          order: 1;
        }
        .card-history {
          order: 4;
        }
        .card-controls {
          order: 3;
        }
      }

      /* ── 减少动效 ── */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="toast" id="toast">操作成功</div>

    <div class="topbar">
      <h1>⚡ 反应速度测试</h1>
      <p>纯前端高精度毫秒捕获 · 评估你的神经反射屏障</p>
    </div>

    <div class="app">
      <div class="panel-left">
        <div class="card">
          <p class="section-title">成绩统计面板</p>
          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-label">平均用时</div>
              <div class="stat-val" id="avgVal">--</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">最佳反应</div>
              <div class="stat-val" id="bestVal" style="color: var(--green)">
                --
              </div>
            </div>
            <div class="stat-box">
              <div class="stat-label">最差记录</div>
              <div class="stat-val" id="worstVal" style="color: var(--red)">
                --
              </div>
            </div>
          </div>
        </div>

        <div class="card card-controls">
          <p class="section-title">流程控制中心</p>
          <div class="btn-row">
            <button class="btn btn-danger" id="resetStatsBtn">重置统计</button>
            <button class="btn btn-primary" id="restartBtn">重新开始</button>
          </div>
        </div>

        <div class="card card-history">
          <p class="section-title">历史追踪记录 (最近10次)</p>
          <div class="history-list" id="historyContainer"></div>
        </div>
      </div>

      <div class="panel-right">
        <div class="card">
          <p class="section-title">反应交互感应区</p>
          <div class="test-zone state-ready" id="testBlock">
            <div class="test-icon" id="testIcon">🔘</div>
            <div class="test-main-text" id="mainText">点击此区域开始测试</div>
            <div class="test-sub-text" id="subText">测试开始后请保持专注</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ── 关闭历史滚动恢复 ──
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }

      (function () {
        // ── DOM 引用 ──
        const testBlock = document.getElementById("testBlock");
        const testIcon = document.getElementById("testIcon");
        const mainText = document.getElementById("mainText");
        const subText = document.getElementById("subText");

        const avgVal = document.getElementById("avgVal");
        const bestVal = document.getElementById("bestVal");
        const worstVal = document.getElementById("worstVal");
        const historyContainer = document.getElementById("historyContainer");

        const restartBtn = document.getElementById("restartBtn");
        const resetStatsBtn = document.getElementById("resetStatsBtn");
        const toast = document.getElementById("toast");

        // ── 状态变量 ──
        let currentState = "ready";
        let timerTimeout = null;
        let startTime = 0;
        let records = [];

        // ── 通用提示 ──
        let toastTimer = null;
        function showToast(msg) {
          toast.textContent = msg || "操作成功";
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            toast.classList.remove("show");
          }, 1500);
        }

        // ── 统计与历史刷新 ──
        function updateStatsUI() {
          if (records.length === 0) {
            avgVal.textContent = "--";
            bestVal.textContent = "--";
            worstVal.textContent = "--";
            historyContainer.innerHTML =
              '<div style="color:var(--sub);font-size:13px;text-align:center;padding:20px;opacity:0.6;">暂无历史记录</div>';
            return;
          }

          const sum = records.reduce((a, b) => a + b, 0);
          const avg = Math.round(sum / records.length);
          const best = Math.min(...records);
          const worst = Math.max(...records);

          avgVal.textContent = `${avg} ms`;
          bestVal.textContent = `${best} ms`;
          worstVal.textContent = `${worst} ms`;

          const recentRecords = records.slice(-10).reverse();
          historyContainer.innerHTML = recentRecords
            .map((score, index) => {
              const displayIndex = records.length - index;
              return `
        <div class="history-item">
          <span class="history-index">第 ${displayIndex} 次测试</span>
          <span class="history-time">${score} ms</span>
        </div>
      `;
            })
            .join("");
        }

        // ── 核心状态机 ──
        function handleBlockClick() {
          if (currentState === "ready" || currentState === "result") {
            currentState = "waiting";
            testBlock.className = "test-zone state-waiting";
            testIcon.textContent = "⏳";
            mainText.textContent = "看到绿色时，立即点击！";
            subText.textContent = "若提前点击将视为违规作弊";

            const randomDelay = Math.random() * 3000 + 2000;
            timerTimeout = setTimeout(() => {
              currentState = "now";
              testBlock.className = "test-zone state-now";
              testIcon.textContent = "⚡";
              mainText.textContent = "快点击！！";
              subText.textContent = "反射弧测量中...";
              startTime = performance.now();
            }, randomDelay);
          } else if (currentState === "waiting") {
            clearTimeout(timerTimeout);
            currentState = "result";
            testBlock.className = "test-zone state-ready";
            testIcon.textContent = "⚠️";
            mainText.textContent = "点早了！";
            subText.textContent = "请在变绿后再进行点击，点击卡片重试";
            showToast("操作违规：变绿前请勿点击");
          } else if (currentState === "now") {
            const endTime = performance.now();
            const reactionTime = Math.round(endTime - startTime);

            records.push(reactionTime);
            currentState = "result";

            testBlock.className = "test-zone state-ready";
            testIcon.textContent = "🎉";
            mainText.textContent = `${reactionTime} ms`;
            subText.textContent = "极佳！点击卡片可再度发起下一轮";

            updateStatsUI();
          }
        }

        // ── 复位与重置 ──
        function doRestart() {
          clearTimeout(timerTimeout);
          currentState = "ready";
          testBlock.className = "test-zone state-ready";
          testIcon.textContent = "🔘";
          mainText.textContent = "点击此区域开始测试";
          subText.textContent = "测试开始后请保持专注";
          showToast("测试盘已复位");
        }

        function doResetStats() {
          if (confirm("确认清空所有累计的成绩统计和历史记录吗？")) {
            records = [];
            updateStatsUI();
            doRestart();
            showToast("统计数据已全部重置");
          }
        }

        // ── 事件绑定与初始化 ──
        testBlock.addEventListener("click", handleBlockClick);
        restartBtn.addEventListener("click", doRestart);
        resetStatsBtn.addEventListener("click", doResetStats);

        updateStatsUI();
      })();
    </script>

    <script>
      (function () {
        "use strict";

        function _isDarkMode() {
          var htmlTheme = document.documentElement.getAttribute("data-theme");
          var bodyTheme = document.body
            ? document.body.getAttribute("data-theme")
            : null;
          if (htmlTheme === "dark" || bodyTheme === "dark") return true;
          if (htmlTheme === "light" || bodyTheme === "light") return false;
          if (document.body && document.body.classList.contains("dark"))
            return true;
          try {
            var bg = getComputedStyle(document.documentElement)
              .getPropertyValue("--primary-bg")
              .trim();
            if (bg) {
              var hex = bg.replace("#", "");
              if (hex.length >= 2) {
                return parseInt(hex.substring(0, 2), 16) < 80;
              }
            }
          } catch (err) {}
          return (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          );
        }

        (function _injectUserSelectCSS() {
          var style = document.createElement("style");
          style.id = "security-user-select";
          style.textContent = [
            "body{",
            "  user-select:none;",
            "  -webkit-user-select:none;",
            "  -moz-user-select:none;",
            "  -ms-user-select:none;",
            "}",
            "input,textarea{",
            "  user-select:text;",
            "  -webkit-user-select:text;",
            "}",
          ].join("\n");
          (document.head || document.documentElement).appendChild(style);
        })();

        document.addEventListener("copy", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
            if (e.clipboardData) e.clipboardData.setData("text/plain", "");
          }
        });

        document.addEventListener("cut", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
          }
        });

        document.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });

        document.addEventListener("keydown", function (e) {
          var key = (e.key || "").toLowerCase();

          if (e.ctrlKey || e.metaKey) {
            if (key === "s") {
              e.preventDefault();
              return false;
            }

            if (["+", "-", "=", "0"].includes(e.key)) {
              e.preventDefault();
              return false;
            }
          }
        });

        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );

        document.addEventListener(
          "gesturestart",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gesturechange",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gestureend",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );

        window.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>
  </body>
</html>
