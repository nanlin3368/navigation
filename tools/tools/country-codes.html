<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>国际区号查询</title>
    <meta
      name="description"
      content="国际区号查询 - 纯本地离线工具，按大洲分类显示全球国家/地区区号，点击卡片即可一键复制区号，内置数据看板，无需联网，快速便捷。"
    />
    <link
      rel="apple-touch-icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/logo.svg"
    />
    <link
      rel="icon"
      href="https://nanlin3368.github.io/navigation/assets/picture/logo.svg"
      type="image/svg+xml"
    />
    <style>
      /* ── 设计令牌 ── */
      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --ink: #1d1d1f;
        --sub: #86868b;
        --accent: #0071e3;
        --accent-press: #0059b3;
        --line: rgba(0, 0, 0, 0.08);
        --radius: 18px;
        --radius-sm: 12px;
      }

      /* ── 基础重置 ── */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        scrollbar-gutter: stable;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ── 顶栏 ── */
      .topbar {
        text-align: center;
        padding: max(28px, env(safe-area-inset-top)) 0 18px;
        flex: 0 0 auto;
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .topbar h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .topbar p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--sub);
      }

      /* ── 主容器与入场动画 ── */
      .app {
        flex: 1 1 auto;
        width: 100%;
        max-width: 1800px;
        margin: 0 auto;
        padding: 0 12px calc(30px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .panel-settings {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
      }
      .panel-results {
        animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.22s both;
      }

      /* ── 卡片与面板 ── */
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 8px 24px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }
      .panel-settings,
      .panel-results {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* ── 区块标题 ── */
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0 0 14px;
      }

      /* ── 大洲分类（移动端 3 列网格） ── */
      .category-group {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .cat-btn {
        width: 100%;
        text-align: center;
        padding: 10px 6px;
        border: 1px solid transparent;
        background: var(--bg);
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
        cursor: pointer;
        transition: all 0.15s ease;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cat-btn:hover {
        background: rgba(0, 0, 0, 0.03);
      }
      .cat-btn.active {
        background: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      /* ── 桌面端顶部胶囊分类条（默认隐藏） ── */
      .category-bar {
        display: none;
        flex-wrap: nowrap;
        gap: 8px;
        overflow-x: auto;
        margin: 0 0 16px;
        padding-bottom: 2px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .category-bar::-webkit-scrollbar {
        display: none;
      }
      .category-bar .cat-btn {
        flex: 0 0 auto;
        width: auto;
        padding: 8px 18px;
        border-radius: 999px;
        font-size: 13px;
      }

      /* ── 区号卡片网格 ── */
      .phone-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .phone-group {
        display: flex;
        flex-direction: column;
      }
      .group-title {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--sub);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .group-title::after {
        content: "";
        flex: 1 1 auto;
        height: 1px;
        background: var(--line);
      }
      .group-count {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
        background: rgba(0, 113, 227, 0.08);
        padding: 2px 8px;
        border-radius: 999px;
      }
      .phone-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
        padding: 4px 0;
      }
      .phone-container-scroll {
        max-height: 460px;
        overflow-y: auto;
        padding-right: 6px;
      }
      .phone-item {
        background: var(--bg);
        border-radius: var(--radius-sm);
        padding: 14px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        cursor: pointer;
        transition:
          transform 0.1s ease,
          background-color 0.15s;
        user-select: none;
        border: 1px solid transparent;
        text-align: center;
      }
      .phone-item:hover {
        background: rgba(0, 0, 0, 0.04);
        transform: scale(1.04);
      }
      .phone-item:active {
        transform: scale(0.98);
        background: var(--line);
      }
      .phone-name {
        font-size: 14px;
        font-weight: 500;
        color: var(--ink);
      }
      .phone-number {
        font-size: 15px;
        font-weight: 700;
        color: var(--accent);
        font-family: ui-monospace, SFMono-Regular, monospace;
      }
      .phone-card {
        flex: 1;
      }

      /* ── 滚动条 ── */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 3px;
      }

      /* ── Toast ── */
      .toast {
        position: fixed;
        top: max(18px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%) translateY(-12px);
        background: rgba(28, 28, 30, 0.92);
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        padding: 12px 22px;
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        z-index: 100;
        max-width: calc(100vw - 40px);
        text-align: center;
        word-break: break-word;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ── 桌面端双栏 ── */
      @media (min-width: 860px) {
        .app {
          flex-direction: row;
          align-items: flex-start;
          padding-bottom: 45px;
        }
        .panel-settings {
          display: none;
        }
        .category-bar {
          display: flex;
        }
        .panel-results {
          flex: 1 1 auto;
          min-width: 0;
        }
        .phone-container-scroll {
          height: 550px;
          max-height: none;
        }
        .phone-list {
          gap: 28px;
        }
      }

      /* ── 减少动效 ── */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="topbar">
      <h1>🌐 国际区号查询</h1>
      <p>纯本地全球大洲分类 · 点击秒级复制国际区号</p>
    </div>

    <div class="app">
      <div class="panel-settings">
        <div class="card category-card">
          <p class="section-title">大洲分类</p>
          <div class="category-group" id="categorySelector"></div>
        </div>
      </div>

      <div class="panel-results">
        <div class="card phone-card">
          <p class="section-title" id="gridTitle">全部区号</p>

          <div class="category-bar" id="categoryBar"></div>

          <div class="phone-container-scroll">
            <div class="phone-list" id="phoneGrid"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ── 关闭历史滚动恢复 ──
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";

      (function () {
        "use strict";

        // ── 数据（按大洲分组） ──
        const PHONE_DATA = [
          {
            name: "亚洲",
            phone: [
              { name: "中国", num: "+86" },
              { name: "中国香港", num: "+852" },
              { name: "中国澳门", num: "+853" },
              { name: "中国台湾", num: "+886" },
              { name: "日本", num: "+81" },
              { name: "韩国", num: "+82" },
              { name: "新加坡", num: "+65" },
              { name: "马来西亚", num: "+60" },
              { name: "泰国", num: "+66" },
              { name: "越南", num: "+84" },
              { name: "菲律宾", num: "+63" },
              { name: "印度尼西亚", num: "+62" },
              { name: "印度", num: "+91" },
              { name: "沙特阿拉伯", num: "+966" },
              { name: "阿联酋", num: "+971" },
            ],
          },
          {
            name: "欧洲",
            phone: [
              { name: "英国", num: "+44" },
              { name: "法国", num: "+33" },
              { name: "德国", num: "+49" },
              { name: "意大利", num: "+39" },
              { name: "俄罗斯", num: "+7" },
              { name: "西班牙", num: "+34" },
              { name: "荷兰", num: "+31" },
              { name: "瑞士", num: "+41" },
              { name: "瑞典", num: "+46" },
              { name: "挪威", num: "+47" },
              { name: "丹麦", num: "+45" },
              { name: "芬兰", num: "+358" },
              { name: "爱尔兰", num: "+353" },
              { name: "比利时", num: "+32" },
              { name: "奥地利", num: "+43" },
            ],
          },
          {
            name: "北美洲",
            phone: [
              { name: "美国", num: "+1" },
              { name: "加拿大", num: "+1" },
              { name: "墨西哥", num: "+52" },
              { name: "古巴", num: "+53" },
              { name: "牙买加", num: "+1-876" },
              { name: "巴拿马", num: "+507" },
              { name: "哥斯达黎加", num: "+506" },
              { name: "波多黎各", num: "+1-787" },
            ],
          },
          {
            name: "南美洲",
            phone: [
              { name: "巴西", num: "+55" },
              { name: "阿根廷", num: "+54" },
              { name: "智利", num: "+56" },
              { name: "哥伦比亚", num: "+57" },
              { name: "秘鲁", num: "+51" },
              { name: "委内瑞拉", num: "+58" },
              { name: "厄瓜多尔", num: "+593" },
              { name: "乌拉圭", num: "+598" },
            ],
          },
          {
            name: "非洲",
            phone: [
              { name: "埃及", num: "+20" },
              { name: "南非", num: "+27" },
              { name: "尼日利亚", num: "+234" },
              { name: "肯尼亚", num: "+254" },
              { name: "摩洛哥", num: "+212" },
              { name: "埃塞俄比亚", num: "+251" },
              { name: "阿尔及利亚", num: "+213" },
              { name: "加纳", num: "+233" },
            ],
          },
          {
            name: "大洋洲",
            phone: [
              { name: "澳大利亚", num: "+61" },
              { name: "新西兰", num: "+64" },
              { name: "斐济", num: "+679" },
              { name: "巴布亚新几内亚", num: "+675" },
              { name: "汤加", num: "+676" },
              { name: "萨摩亚", num: "+685" },
            ],
          },
        ];

        const ALL_INDEX = -1;
        const TOTAL = PHONE_DATA.reduce((sum, c) => sum + c.phone.length, 0);

        // ── DOM 引用 ──
        const categorySelector = document.getElementById("categorySelector");
        const categoryBar = document.getElementById("categoryBar");
        const phoneGrid = document.getElementById("phoneGrid");
        const gridTitle = document.getElementById("gridTitle");
        const toast = document.getElementById("toast");

        // ── 状态：默认选中「全部」 ──
        let activeIndex = ALL_INDEX;

        // ── 提示条 ──
        let toastTimer = null;
        function showToast(msg) {
          toast.textContent = msg || "操作成功";
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
        }

        // ── 剪贴板 ──
        function copyToClipboard(text) {
          if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
          }
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          return Promise.resolve();
        }

        // ── 单个区号卡片 HTML ──
        function itemHTML(item) {
          return `<div class="phone-item" data-num="${item.num}" title="点击复制区号">
                    <span class="phone-name">${item.name}</span>
                    <span class="phone-number">${item.num}</span>
                  </div>`;
        }

        // ── 渲染区号卡片 ──
        function renderNumbers(index) {
          if (index === ALL_INDEX) {
            gridTitle.textContent = `全部区号 (${TOTAL})`;
            phoneGrid.innerHTML = PHONE_DATA.map(
              (cat) => `
                <section class="phone-group">
                  <p class="group-title">
                    ${cat.name}
                    <span class="group-count">${cat.phone.length}</span>
                  </p>
                  <div class="phone-grid">${cat.phone.map(itemHTML).join("")}</div>
                </section>`,
            ).join("");
          } else {
            const category = PHONE_DATA[index];
            gridTitle.textContent = `${category.name} (${category.phone.length})`;
            phoneGrid.innerHTML = `<div class="phone-grid">${category.phone
              .map(itemHTML)
              .join("")}</div>`;
          }

          phoneGrid.querySelectorAll(".phone-item").forEach((item) => {
            item.addEventListener("click", () => {
              const num = item.dataset.num;
              copyToClipboard(num).then(() =>
                showToast(`✅ 成功复制区号: ${num}`),
              );
            });
          });
        }

        // ── 同步两侧按钮激活态 ──
        function syncActive() {
          document.querySelectorAll(".cat-btn").forEach((btn) => {
            btn.classList.toggle(
              "active",
              parseInt(btn.dataset.index, 10) === activeIndex,
            );
          });
        }

        // ── 渲染大洲分类 ──
        function renderCategories() {
          const allBtn = `<button class="cat-btn" data-index="${ALL_INDEX}">全部</button>`;
          const base = PHONE_DATA.map(
            (cat, idx) =>
              `<button class="cat-btn" data-index="${idx}">${cat.name}</button>`,
          ).join("");

          categorySelector.innerHTML = allBtn + base;
          categoryBar.innerHTML = allBtn + base;

          document.querySelectorAll(".cat-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              activeIndex = parseInt(btn.dataset.index, 10);
              syncActive();
              renderNumbers(activeIndex);
            });
          });

          syncActive();
        }

        // ── 初始化 ──
        renderCategories();
        renderNumbers(activeIndex);
      })();
    </script>

    <script>
      (function () {
        "use strict";

        function _isDarkMode() {
          var htmlTheme = document.documentElement.getAttribute("data-theme");
          var bodyTheme = document.body
            ? document.body.getAttribute("data-theme")
            : null;
          if (htmlTheme === "dark" || bodyTheme === "dark") return true;
          if (htmlTheme === "light" || bodyTheme === "light") return false;
          if (document.body && document.body.classList.contains("dark"))
            return true;
          try {
            var bg = getComputedStyle(document.documentElement)
              .getPropertyValue("--primary-bg")
              .trim();
            if (bg) {
              var hex = bg.replace("#", "");
              if (hex.length >= 2) {
                return parseInt(hex.substring(0, 2), 16) < 80;
              }
            }
          } catch (err) {}
          return (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          );
        }

        (function _injectUserSelectCSS() {
          var style = document.createElement("style");
          style.id = "security-user-select";
          style.textContent = [
            "body{",
            "  user-select:none;",
            "  -webkit-user-select:none;",
            "  -moz-user-select:none;",
            "  -ms-user-select:none;",
            "}",
            "input,textarea{",
            "  user-select:text;",
            "  -webkit-user-select:text;",
            "}",
          ].join("\n");
          (document.head || document.documentElement).appendChild(style);
        })();

        document.addEventListener("copy", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
            if (e.clipboardData) e.clipboardData.setData("text/plain", "");
          }
        });

        document.addEventListener("cut", function (e) {
          var tag =
            e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
          }
        });

        document.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });

        document.addEventListener("keydown", function (e) {
          var key = (e.key || "").toLowerCase();

          if (e.ctrlKey || e.metaKey) {
            if (key === "s") {
              e.preventDefault();
              return false;
            }

            if (["+", "-", "=", "0"].includes(e.key)) {
              e.preventDefault();
              return false;
            }
          }
        });

        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );

        document.addEventListener(
          "gesturestart",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gesturechange",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "gestureend",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );

        window.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>
  </body>
</html>
